name: Phase 3 source closure

on:
  push:
    branches:
      - beta11-source-reconstruction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: beta11-source-reconstruction
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Compile complete reconstructed source
        shell: bash
        run: ./gradlew --no-daemon --no-configuration-cache clean compileJava processResources jar

      - name: Reconcile compiled class topology with Hotfix3
        shell: bash
        run: |
          grep -E '^[0-9a-f]{64}  dev/cchqphysics/compat/.*\.class$' docs/baseline/HOTFIX3_SHA256SUMS.txt \
            | sed -E 's/^[0-9a-f]{64}  //' \
            | sort > expected-classes.txt

          find build/classes/java/main -type f -name '*.class' -printf '%P\n' \
            | sort > actual-classes.txt

          echo "Hotfix3 expected classes: $(wc -l < expected-classes.txt)"
          echo "Reconstructed classes:    $(wc -l < actual-classes.txt)"
          diff -u expected-classes.txt actual-classes.txt
          test "$(wc -l < expected-classes.txt)" -eq 60
          test "$(wc -l < actual-classes.txt)" -eq 60

      - name: Reconcile source-relevant processed resources
        shell: bash
        run: |
          for path in \
            META-INF/MANIFEST.MF \
            META-INF/neoforge.mods.toml \
            META-INF/accesstransformer.cfg \
            cchq_soundphysics_compat.mixins.json \
            assets/cchq_soundphysics_compat/lang/en_us.json
          do
            test -f "build/resources/main/$path"
          done
          echo 'All five source-relevant Hotfix3 resources are present in processed output.'

      - name: Phase 3 source gate summary
        shell: bash
        run: |
          echo 'compileJava: PASS'
          echo 'jar: PASS'
          echo 'Hotfix3 60-class topology: PASS'
          echo 'source-relevant processed resources: PASS'
