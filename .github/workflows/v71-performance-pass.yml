name: V7.1 Performance Pass

on:
  push:
    branches:
      - phase5-v7-1-performance-pass

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen V7.1 ancestry
        shell: bash
        run: git merge-base --is-ancestor ffcf5f6e05d85b69f1f1dff8cfae1b082b71604d HEAD

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify performance-only source delta
        shell: bash
        run: |
          git diff --check ffcf5f6e05d85b69f1f1dff8cfae1b082b71604d..HEAD -- gradle.properties src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          test "$(git diff --name-only ffcf5f6e05d85b69f1f1dff8cfae1b082b71604d..HEAD -- gradle.properties src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java | sort | tr '\n' ' ')" = "gradle.properties src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java "
          grep -F 'double rawRatio = Math.max(0.0D, legRaw / Math.max(1.0E-6D, raw));' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'double pathGain = Math.pow(clampFilter(gain), rawRatio);' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'double pathCutoff = Math.pow(clampFilter(cutoff), rawRatio);' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'double spread = apertureSpreading(candidate.apertureDistance, DiffractionConfig.apertureSpreadScale());' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'private static final int OPENING_VERIFY_CANDIDATES = 2;' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'private static final int OPENING_MAX_CONFIG_RADIUS = 8;' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'CACHE_PRUNE_INTERVAL_NS = 1_000_000_000L' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'maybePruneCaches(now);' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'return List.of();' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'mod_version=0.1.0-beta11-phase5-v7-1-performance-test' gradle.properties

      - name: Build
        shell: bash
        run: ./gradlew clean build --no-daemon

      - name: Inspect artifact
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n1)
          test -n "$JAR"
          export JAR
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          sha256sum "$JAR"
          python - <<'PY'
          import os, zipfile
          jar=os.environ['JAR']
          with zipfile.ZipFile(jar) as z:
              classes=[n for n in z.namelist() if n.endswith('.class')]
              print('class_count=', len(classes))
              assert len(classes) == 81, len(classes)
          PY

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: v7-1-performance-test
          path: ${{ env.JAR }}
          if-no-files-found: error
