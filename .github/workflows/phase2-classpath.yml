name: Phase 2 reconstruction classpath

on:
  push:
    branches:
      - beta11-source-reconstruction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classpath:
    runs-on: ubuntu-latest

    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Show toolchain
        run: |
          java -version
          gradle --version

      - name: Resolve reconstruction compile classpath
        run: gradle --no-daemon --no-configuration-cache --stacktrace verifyReconstructionClasspath

      - name: Validate Gradle project model
        run: gradle --no-daemon --no-configuration-cache --stacktrace tasks --all
