name: Release hardening decode pass

on:
  push:
    branches: [phase5-v7-1-release-hardening]

permissions:
  contents: write

jobs:
  patch-build:
    if: github.event.head_commit.message == 'ci: apply decode release hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: phase5-v7-1-release-hardening
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Patch decode lifecycle and memory hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java')
          s = p.read_text()

          def once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              s = s.replace(old, new, 1)

          once('''import java.util.concurrent.CompletableFuture;
          import java.util.concurrent.CompletionException;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ConcurrentLinkedQueue;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.atomic.AtomicInteger;
          ''', '''import java.util.concurrent.ArrayBlockingQueue;
          import java.util.concurrent.CompletableFuture;
          import java.util.concurrent.CompletionException;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ConcurrentLinkedQueue;
          import java.util.concurrent.RejectedExecutionException;
          import java.util.concurrent.ThreadPoolExecutor;
          import java.util.concurrent.TimeUnit;
          import java.util.concurrent.atomic.AtomicInteger;
          ''', 'concurrency imports')

          once('''    private static final ExecutorService DECODER = Executors.newSingleThreadExecutor(r -> {
              Thread t = new Thread(r, "CC-HQ SoundPhysics decoder");
              t.setDaemon(true);
              return t;
          });
          private static final ConcurrentLinkedQueue<StartRequest> READY = new ConcurrentLinkedQueue<>();
          private static final ConcurrentHashMap<DecodeKey, DecodeEntry> DECODES = new ConcurrentHashMap<>();
          private static final ConcurrentHashMap<UUID, AtomicInteger> GENERATIONS = new ConcurrentHashMap<>();
          private static final Set<String> LOGGED = ConcurrentHashMap.newKeySet();
          private static final int MAX_DECODE_CACHE_ENTRIES = 4;
          ''', '''    private static final int MAX_PENDING_DECODE_TASKS = 8;
          private static final ThreadPoolExecutor DECODER = new ThreadPoolExecutor(
                  1, 1, 0L, TimeUnit.MILLISECONDS,
                  new ArrayBlockingQueue<>(MAX_PENDING_DECODE_TASKS),
                  r -> {
                      Thread t = new Thread(r, "CC-HQ SoundPhysics decoder");
                      t.setDaemon(true);
                      return t;
                  },
                  new ThreadPoolExecutor.AbortPolicy());
          private static final ConcurrentLinkedQueue<StartRequest> READY = new ConcurrentLinkedQueue<>();
          private static final ConcurrentHashMap<DecodeKey, DecodeEntry> DECODES = new ConcurrentHashMap<>();
          private static final ConcurrentHashMap<UUID, AtomicInteger> GENERATIONS = new ConcurrentHashMap<>();
          private static final Set<String> LOGGED = ConcurrentHashMap.newKeySet();
          private static final int MAX_DECODE_CACHE_ENTRIES = 4;
          private static final long MAX_DECODE_CACHE_BYTES = 128L * 1024L * 1024L;
          private static final byte[] EMPTY_AUDIO_DATA = new byte[0];
          ''', 'decoder executor')

          once('''        if (audio.format().endsWith("_STREAM") || "PCM_S16LE".equals(audio.format())) return false;
              if (!AudioDecoder.canDecode(audio.format(), audio.data())) {
                  logOnce("decoder-" + audio.format(), "No compatible decoder for CC:HQ format " + audio.format() + "; that format will use normal CC:HQ playback.");
                  return false;
              }

              int generation = GENERATIONS.computeIfAbsent(audio.source(), ignored -> new AtomicInteger()).incrementAndGet();
              int epoch = SESSION_EPOCH.get();
              DecodeKey key = makeDecodeKey(audio);
              DecodeEntry entry = DECODES.compute(key, (k, old) -> {
                  if (old != null) {
                      old.lastUsedTick = clientTicks;
                      return old;
                  }
                  CompletableFuture<DecodedAudio> future = CompletableFuture.supplyAsync(() -> {
                      try {
                          return AudioDecoder.decode(audio.format(), audio.data());
                      } catch (Throwable t) {
                          throw new CompletionException(t);
                      }
                  }, DECODER);
                  return new DecodeEntry(future, clientTicks);
              });

              entry.future.whenComplete((decoded, error) -> {
                  if (error != null) {
                      logOnce("decode-runtime-" + audio.format(), "Decoder accepted " + audio.format() + " but failed while decoding: " + rootMessage(error));
                      return;
                  }
                  READY.add(new StartRequest(audio, key, decoded, generation, epoch));
              });
              return true;
          ''', '''        if (audio.format().endsWith("_STREAM") || "PCM_S16LE".equals(audio.format())) {
                  handoffToNative(audio.source());
                  return false;
              }
              if (!AudioDecoder.canDecode(audio.format(), audio.data())) {
                  logOnce("decoder-" + audio.format(), "No compatible decoder for CC:HQ format " + audio.format() + "; that format will use normal CC:HQ playback.");
                  handoffToNative(audio.source());
                  return false;
              }

              int epoch = SESSION_EPOCH.get();
              DecodeKey key = makeDecodeKey(audio);
              final DecodeEntry entry;
              try {
                  entry = DECODES.compute(key, (k, old) -> {
                      if (old != null) {
                          old.lastUsedTick = clientTicks;
                          return old;
                      }
                      CompletableFuture<DecodedAudio> future = CompletableFuture.supplyAsync(() -> {
                          try {
                              return AudioDecoder.decode(audio.format(), audio.data());
                          } catch (Throwable t) {
                              throw new CompletionException(t);
                          }
                      }, DECODER);
                      return new DecodeEntry(future, clientTicks);
                  });
              } catch (RejectedExecutionException rejected) {
                  logOnce("decode-overload", "Decoder queue is full; excess audio will use normal CC:HQ playback instead of accumulating decode work.");
                  handoffToNative(audio.source());
                  return false;
              }

              int generation = GENERATIONS.computeIfAbsent(audio.source(), ignored -> new AtomicInteger()).incrementAndGet();
              entry.future.whenComplete((decoded, error) -> {
                  if (error != null) {
                      DECODES.remove(key, entry);
                      logOnce("decode-runtime-" + audio.format(), "Decoder accepted " + audio.format() + " but failed while decoding: " + rootMessage(error));
                      return;
                  }
                  if (epoch != SESSION_EPOCH.get()) return;
                  AtomicInteger currentGeneration = GENERATIONS.get(audio.source());
                  if (currentGeneration == null || currentGeneration.get() != generation) return;
                  READY.add(new StartRequest(playbackMetadata(audio), key, decoded, generation, epoch));
              });
              return true;
          ''', 'decode scheduling')

          once('''            List<Map.Entry<DecodeKey, DecodeEntry>> completed = DECODES.entrySet().stream()
                      .filter(e -> e.getValue().future.isDone())
                      .sorted(Comparator.comparingLong(e -> e.getValue().lastUsedTick))
                      .toList();
              int excess = completed.size() - MAX_DECODE_CACHE_ENTRIES;
              for (int i = 0; i < excess; i++) {
                  Map.Entry<DecodeKey, DecodeEntry> oldest = completed.get(i);
                  DECODES.remove(oldest.getKey(), oldest.getValue());
              }
          ''', '''            List<Map.Entry<DecodeKey, DecodeEntry>> completed = DECODES.entrySet().stream()
                      .filter(e -> e.getValue().future.isDone())
                      .sorted(Comparator.comparingLong(e -> e.getValue().lastUsedTick))
                      .toList();
              long completedBytes = 0L;
              for (Map.Entry<DecodeKey, DecodeEntry> item : completed) {
                  DecodedAudio decoded = completedDecoded(item.getValue());
                  if (decoded != null) completedBytes += decoded.monoPcm16Le().length;
              }
              int remaining = completed.size();
              for (Map.Entry<DecodeKey, DecodeEntry> oldest : completed) {
                  if (remaining <= MAX_DECODE_CACHE_ENTRIES && completedBytes <= MAX_DECODE_CACHE_BYTES) break;
                  DecodedAudio decoded = completedDecoded(oldest.getValue());
                  if (DECODES.remove(oldest.getKey(), oldest.getValue())) {
                      remaining--;
                      if (decoded != null) completedBytes -= decoded.monoPcm16Le().length;
                  }
              }
          ''', 'decode cache trim')

          once('''        SESSION_EPOCH.incrementAndGet();
              READY.clear();
              DECODES.clear();
          ''', '''        SESSION_EPOCH.incrementAndGet();
              READY.clear();
              DECODER.getQueue().clear();
              DECODES.clear();
          ''', 'session decode invalidation')

          once('''    private static DecodeKey makeDecodeKey(HQPayloadView.Audio audio) {
          ''', '''    private static void handoffToNative(UUID source) {
              GENERATIONS.computeIfAbsent(source, ignored -> new AtomicInteger()).incrementAndGet();
              onSoundThread(() -> stopSource(source));
          }

          private static HQPayloadView.Audio playbackMetadata(HQPayloadView.Audio audio) {
              return new HQPayloadView.Audio(audio.source(), audio.format(), audio.volume(),
                      audio.x(), audio.y(), audio.z(), EMPTY_AUDIO_DATA, audio.startTick(),
                      audio.syncGroupId(), audio.syncGroupSize());
          }

          private static DecodedAudio completedDecoded(DecodeEntry entry) {
              if (!entry.future.isDone() || entry.future.isCompletedExceptionally() || entry.future.isCancelled()) return null;
              return entry.future.getNow(null);
          }

          private static DecodeKey makeDecodeKey(HQPayloadView.Audio audio) {
          ''', 'hardening helpers')

          p.write_text(s)
          PY
          git diff --check
          git diff -- src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java

      - name: Assert hardening scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          mgr=src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java
          grep -F 'new ArrayBlockingQueue<>(MAX_PENDING_DECODE_TASKS)' "$mgr"
          grep -F 'DECODER.getQueue().clear();' "$mgr"
          grep -F 'if (epoch != SESSION_EPOCH.get()) return;' "$mgr"
          grep -F 'READY.add(new StartRequest(playbackMetadata(audio), key, decoded, generation, epoch));' "$mgr"
          grep -F 'private static final long MAX_DECODE_CACHE_BYTES = 128L * 1024L * 1024L;' "$mgr"
          grep -F 'handoffToNative(audio.source());' "$mgr"
          grep -F 'return Beta9Optimizer.isAudibleAndRecord(state.sourceId) & beta9EligibleReal(state, now);' src/main/java/dev/cchqphysics/compat/audio/SoundPhysicsBridge.java
          base='be03d30efe98ca03bdf27764bcea567df5ef3875'
          test "$(git diff --name-only "$base" -- | grep -v '^src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java$' | grep -v '^.github/workflows/release-hardening-decode.yml$' | wc -l)" -eq 0
          git diff --exit-code "$base" -- \
            src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java \
            src/main/java/dev/cchqphysics/compat/audio/SynchronizedSpectralBalancer.java \
            src/main/java/dev/cchqphysics/compat/audio/ProgressiveOcclusionModel.java \
            src/main/java/dev/cchqphysics/compat/audio/EnvironmentSmoother.java \
            src/main/java/dev/cchqphysics/compat/audio/SoundPhysicsBridge.java \
            src/main/java/dev/cchqphysics/compat/config/ClientConfig.java \
            src/main/java/dev/cchqphysics/compat/config/DiffractionConfig.java \
            src/main/java/dev/cchqphysics/compat/config/SpectralMixConfig.java
          test -z "$(git diff --name-only "$base" -- '*.lua')"

      - name: Commit hardening source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ztawfik523-lgtm'
          git config user.email 'ztawfik523@gmail.com'
          git add src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java
          git commit -m 'fix: bound decode work and discard stale session completions'
          git push origin HEAD:phase5-v7-1-release-hardening
          git rev-parse HEAD | tee hardening-source-commit.txt

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Verify reconstruction classpath
        run: ./gradlew --no-configuration-cache verifyReconstructionClasspath --stacktrace

      - name: Verify resource wiring
        run: ./gradlew --no-configuration-cache verifyResourceWiring --stacktrace

      - name: Clean
        run: ./gradlew --no-configuration-cache clean --stacktrace

      - name: Compile Java 21
        run: ./gradlew --no-configuration-cache compileJava --stacktrace

      - name: Build hardening candidate
        run: ./gradlew --no-configuration-cache jar --stacktrace

      - name: Inspect candidate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          jar tf "$jar" | sort > hardening-jar-contents.txt
          count="$(grep -c '\.class$' hardening-jar-contents.txt)"
          echo "class_count=$count"
          test "$count" -eq 81
          sha256sum "$jar" | tee hardening-jar-sha256.txt
          {
            echo "source_commit=$(cat hardening-source-commit.txt)"
            echo 'lifecycle_base=be03d30efe98ca03bdf27764bcea567df5ef3875'
            echo 'performance_base=962eab8b052466ca984496a7dec0767dc65803f4'
            echo 'frozen_acoustic_base=ffcf5f6e05d85b69f1f1dff8cfae1b082b71604d'
            echo 'bounded_decode_queue=true'
            echo 'stale_decode_completion_drop=true'
            echo 'queued_decode_clear_on_session_invalidation=true'
            echo 'decoded_cache_byte_cap=134217728'
            echo 'active_ready_payload_data_stripped=true'
            echo 'native_fallback_handoff=true'
            echo 'acoustic_model_changes=false'
            echo 'lua_changes=false'
            echo 'game_launch_performed=false'
          } > hardening-build-info.txt

      - name: Upload hardening candidate
        uses: actions/upload-artifact@v4
        with:
          name: cchq-release-hardening-decode-test
          path: |
            build/libs/*.jar
            hardening-source-commit.txt
            hardening-jar-contents.txt
            hardening-jar-sha256.txt
            hardening-build-info.txt
