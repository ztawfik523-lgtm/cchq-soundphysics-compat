name: Phase 5 spectral mix v2 experiment

on:
  push:
    branches:
      - phase5-mix-v2
    paths:
      - 'tools/phase5_mix_v2_patch.py'
      - '.github/workflows/phase5-mix-v2-build.yml'
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'gradle.properties'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: phase5-mix-v2
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply deterministic v2 patch
        run: python3 tools/phase5_mix_v2_patch.py

      - name: Commit patched experiment source when needed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/main/java src/main/resources gradle.properties
            git commit -m 'Phase 5: add spectral-only synchronized mix v2'
            git push origin HEAD:phase5-mix-v2
          fi

      - name: Assert frozen known-good candidate remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          expected='44612192d875e43ecef66ca51798cab7adb17020'
          actual="$(git ls-remote origin refs/heads/phase5-test-candidate-1 | awk '{print $1}')"
          test "$actual" = "$expected"
          echo "Known-good candidate still frozen at $actual"

      - name: Assert v2 never changes source gain/position path
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin phase5-test-candidate-1
          git diff --exit-code origin/phase5-test-candidate-1 -- \
            src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java \
            src/main/java/dev/cchqphysics/compat/audio/DistanceBridge.java \
            src/main/java/dev/cchqphysics/compat/audio/PositionStabilizer.java
          ! grep -q 'AL_GAIN' src/main/java/dev/cchqphysics/compat/audio/SynchronizedSpectralBalancer.java
          ! grep -q 'AL_POSITION' src/main/java/dev/cchqphysics/compat/audio/SynchronizedSpectralBalancer.java
          ! grep -q 'AL_AUXILIARY_SEND_FILTER' src/main/java/dev/cchqphysics/compat/audio/SynchronizedSpectralBalancer.java
          grep -F 'float targetCutoff = SynchronizedSpectralBalancer.adjustDirectCutoff(sourceId, adjusted[0]);' \
            src/main/java/dev/cchqphysics/compat/audio/EnvironmentSmoother.java
          grep -F 'float targetGain = adjusted[1];' src/main/java/dev/cchqphysics/compat/audio/EnvironmentSmoother.java

      - name: Assert v2 defaults OFF and conservative
        shell: bash
        run: |
          set -euo pipefail
          f=src/main/java/dev/cchqphysics/compat/config/SpectralMixConfig.java
          grep -F '.define("enabled", false)' "$f"
          grep -F '.defineInRange("peer_clear_cutoff", 0.65D, 0.0D, 1.0D)' "$f"
          grep -F '.defineInRange("clarity_floor_ratio", 0.18D, 0.0D, 0.75D)' "$f"
          grep -F '.defineInRange("max_cutoff_lift", 0.12D, 0.0D, 0.75D)' "$f"
          grep -Fx 'mod_version=0.1.0-beta11-phase5-mixv2-test' gradle.properties
          grep -F 'version="0.1.0-beta11-phase5-mixv2-test"' src/main/resources/META-INF/neoforge.mods.toml

      - name: Verify reconstruction compile classpath
        run: ./gradlew --no-configuration-cache verifyReconstructionClasspath --stacktrace

      - name: Verify resource wiring
        run: ./gradlew --no-configuration-cache verifyResourceWiring --stacktrace

      - name: Clean compile v2
        run: ./gradlew --no-configuration-cache clean compileJava --stacktrace

      - name: Build v2 JAR
        run: ./gradlew --no-configuration-cache jar --stacktrace

      - name: Inspect artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*phase5-mixv2-test*.jar)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          jar tf "$jar" | sort > phase5-mixv2-jar-contents.txt
          count="$(grep -c '\.class$' phase5-mixv2-jar-contents.txt)"
          test "$count" -eq 67
          grep -Fx 'dev/cchqphysics/compat/config/SpectralMixConfig.class' phase5-mixv2-jar-contents.txt
          grep -Fx 'dev/cchqphysics/compat/audio/SynchronizedSpectralBalancer.class' phase5-mixv2-jar-contents.txt
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-beta11-phase5-mixv2-test"'
          sha256sum "$jar" | tee phase5-mixv2-jar-sha256.txt
          printf '%s\n' "source_commit=$(git rev-parse HEAD)" > phase5-mixv2-build-info.txt
          printf '%s\n' 'base_candidate=44612192d875e43ecef66ca51798cab7adb17020' >> phase5-mixv2-build-info.txt
          printf '%s\n' 'feature_default_enabled=false' >> phase5-mixv2-build-info.txt
          printf '%s\n' 'source_gain_path_changed=false' >> phase5-mixv2-build-info.txt
          printf '%s\n' 'position_path_changed=false' >> phase5-mixv2-build-info.txt
          printf '%s\n' 'reverb_send_filters_changed=false' >> phase5-mixv2-build-info.txt
          printf '%s\n' 'game_launch_performed=false' >> phase5-mixv2-build-info.txt

      - name: Upload v2 experiment build
        uses: actions/upload-artifact@v4
        with:
          name: cchq-phase5-spectral-mix-v2
          path: |
            build/libs/*phase5-mixv2-test*.jar
            phase5-mixv2-jar-contents.txt
            phase5-mixv2-jar-sha256.txt
            phase5-mixv2-build-info.txt
