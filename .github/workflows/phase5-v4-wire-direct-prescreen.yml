name: Phase 5 V4 one-shot direct-roof prescreen

on:
  push:
    branches:
      - phase5-opening-diffraction-test-v4
    paths:
      - '.github/workflows/phase5-v4-wire-direct-prescreen.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5-opening-diffraction-test-v4
          fetch-depth: 0

      - name: Skip known-blocked V3 vertical ray using cheap topology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java')
          s = p.read_text()
          i8 = ' ' * 8
          i16 = ' ' * 16
          marker = i8 + '// Preserve the runtime-approved V3 direct open-top route exactly for\n'
          if s.count(marker) != 1:
              raise SystemExit(f'expected one direct-route marker, found {s.count(marker)}')
          insert = (
              i8 + '// A cheap shared roof scan can prove that the V3 direct vertical leg\n'
              + i8 + '// is blocked before we spend an SPR occlusion call on it. Open-top V3\n'
              + i8 + '// behavior is unchanged because no barrier is found in that geometry.\n'
              + i8 + 'OpeningTopology listenerTopology = sourceIsLower ? null : getOpeningTopology(listener);\n'
              + i8 + 'boolean directKnownBlocked = listenerTopology != null\n'
              + i16 + '&& listenerTopology.barrierY != Integer.MIN_VALUE\n'
              + i16 + '&& source.y > listenerTopology.barrierY + 0.5D;\n\n'
          )
          s = s.replace(marker, insert + marker, 1)
          old_if = i8 + 'if (raw >= DiffractionConfig.rawOcclusionGate()'
          new_if = i8 + 'if (!directKnownBlocked\n' + i16 + '&& raw >= DiffractionConfig.rawOcclusionGate()'
          if s.count(old_if) != 1:
              raise SystemExit(f'expected one direct-route if, found {s.count(old_if)}')
          s = s.replace(old_if, new_if, 1)
          p.write_text(s)
          PY

      - name: Assert direct-roof prescreen
        shell: bash
        run: |
          set -euo pipefail
          f=src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'OpeningTopology listenerTopology = sourceIsLower ? null : getOpeningTopology(listener);' "$f"
          grep -F 'boolean directKnownBlocked = listenerTopology != null' "$f"
          grep -F 'if (!directKnownBlocked' "$f"

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase5-v4-wire-direct-prescreen.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Phase 5: skip known-blocked direct diffraction ray [skip ci]'
          git push origin HEAD:phase5-opening-diffraction-test-v4
