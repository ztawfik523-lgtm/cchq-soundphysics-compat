name: Phase 5 elevation diffraction isolation verification

on:
  push:
    branches:
      - phase5-elevation-diffraction-test
    paths:
      - '.github/workflows/phase5-elevation-diffraction.yml'
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'gradle.properties'
      - 'build.gradle'
      - 'docs/PHASE5_ELEVATION_DIFFRACTION_TEST.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out elevation diffraction branch
        uses: actions/checkout@v4
        with:
          ref: phase5-elevation-diffraction-test
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Wire diffraction probe into physical-source and EFX paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bridge = Path('src/main/java/dev/cchqphysics/compat/audio/SoundPhysicsBridge.java')
          text = bridge.read_text()

          replacements = [
              (
                  '    static synchronized void unregisterSource(int sourceId) {\n'
                  '        STATES.remove(sourceId);\n'
                  '        AcousticCapture.unregister(sourceId);\n',
                  '    static synchronized void unregisterSource(int sourceId) {\n'
                  '        STATES.remove(sourceId);\n'
                  '        AcousticCapture.unregister(sourceId);\n'
                  '        VerticalDiffractionRelief.unregister(sourceId);\n'
              ),
              (
                  '    static void apply(int sourceId, UUID uuid, double x, double y, double z) {\n'
                  '        ProgressiveOcclusionModel.updateSource(sourceId, x, y, z);\n',
                  '    static void apply(int sourceId, UUID uuid, double x, double y, double z) {\n'
                  '        VerticalDiffractionRelief.updateSource(sourceId, x, y, z);\n'
                  '        ProgressiveOcclusionModel.updateSource(sourceId, x, y, z);\n'
              ),
              (
                  '        PositionStabilizer.clear();\n',
                  '        PositionStabilizer.clear();\n'
                  '        VerticalDiffractionRelief.clear();\n'
              ),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit('SoundPhysicsBridge patch anchor missing: ' + repr(old))
              text = text.replace(old, new, 1)
          bridge.write_text(text)

          smoother = Path('src/main/java/dev/cchqphysics/compat/audio/EnvironmentSmoother.java')
          text = smoother.read_text()
          old = ('        float[] adjusted = ProgressiveOcclusionModel.adjust(sourceId, directCutoff, directGain);\n'
                 '        float targetCutoff = SynchronizedSpectralBalancer.adjustDirectCutoff(sourceId, adjusted[0]);\n')
          new = ('        float[] adjusted = ProgressiveOcclusionModel.adjust(sourceId, directCutoff, directGain);\n'
                 '        adjusted = VerticalDiffractionRelief.adjust(sourceId, adjusted[0], adjusted[1]);\n'
                 '        float targetCutoff = SynchronizedSpectralBalancer.adjustDirectCutoff(sourceId, adjusted[0]);\n')
          if new not in text:
              if old not in text:
                  raise SystemExit('EnvironmentSmoother patch anchor missing')
              text = text.replace(old, new, 1)
          smoother.write_text(text)
          PY

      - name: Commit exact wired runtime source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/dev/cchqphysics/compat/audio/SoundPhysicsBridge.java \
                  src/main/java/dev/cchqphysics/compat/audio/EnvironmentSmoother.java
          if ! git diff --cached --quiet; then
            git commit -m 'Phase 5: wire isolated elevation diffraction probe [skip ci]'
            git push origin HEAD:phase5-elevation-diffraction-test
          fi
          echo "RUNTIME_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Assert frozen baselines and approved HF50 source
        shell: bash
        run: |
          set -euo pipefail
          phase4='79eed29767343ee34022e8f6268b386f75e84c9f'
          known_good='44612192d875e43ecef66ca51798cab7adb17020'
          hf50='62d3a7a0a176c901402b913946d98f3cb455a8f4'
          test "$(git ls-remote origin refs/heads/phase4-hotfix3-parity | awk '{print $1}')" = "$phase4"
          test "$(git ls-remote origin refs/heads/phase5-test-candidate-1 | awk '{print $1}')" = "$known_good"
          test "$(git ls-remote origin refs/heads/archive-phase5-hf50-config-runtime-approved | awk '{print $1}')" = "$hf50"

      - name: Assert diffraction identity and default-off config
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mod_version=0.1.0-beta11-phase5-diffraction-test' gradle.properties
          grep -F 'VERSION = "0.1.0-beta11-phase5-diffraction-test"' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java
          grep -F 'version="0.1.0-beta11-phase5-diffraction-test"' src/main/resources/META-INF/neoforge.mods.toml
          cfg=src/main/java/dev/cchqphysics/compat/config/DiffractionConfig.java
          grep -F '.define("enabled", false)' "$cfg"
          grep -F '.defineInRange("min_vertical_separation", 3.0D' "$cfg"
          grep -F '.defineInRange("min_horizontal_separation", 1.5D' "$cfg"
          grep -F '.defineInRange("max_horizontal_separation", 12.0D' "$cfg"
          grep -F '.defineInRange("raw_occlusion_gate", 3.0D' "$cfg"
          grep -F '.defineInRange("vertical_open_gate", 0.25D' "$cfg"
          grep -F '.defineInRange("diffraction_penalty", 1.0D' "$cfg"

      - name: Assert HF50 and core behavior remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          base='62d3a7a0a176c901402b913946d98f3cb455a8f4'
          for f in \
            src/main/java/dev/cchqphysics/compat/audio/SynchronizedSpectralBalancer.java \
            src/main/java/dev/cchqphysics/compat/config/SpectralMixConfig.java \
            src/main/java/dev/cchqphysics/compat/audio/ProgressiveOcclusionModel.java \
            src/main/java/dev/cchqphysics/compat/audio/SyncStartCoordinator.java \
            src/main/java/dev/cchqphysics/compat/audio/PositionStabilizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta9Optimizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta10Optimizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta11RoomRayCache.java \
            src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java \
            src/main/java/dev/cchqphysics/compat/config/ClientConfig.java; do
            git diff --exit-code "$base" -- "$f"
          done

      - name: Assert diffraction wiring is narrow
        shell: bash
        run: |
          set -euo pipefail
          bridge=src/main/java/dev/cchqphysics/compat/audio/SoundPhysicsBridge.java
          smoother=src/main/java/dev/cchqphysics/compat/audio/EnvironmentSmoother.java
          probe=src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'VerticalDiffractionRelief.updateSource(sourceId, x, y, z);' "$bridge"
          grep -F 'VerticalDiffractionRelief.unregister(sourceId);' "$bridge"
          grep -F 'VerticalDiffractionRelief.clear();' "$bridge"
          grep -F 'adjusted = VerticalDiffractionRelief.adjust(sourceId, adjusted[0], adjusted[1]);' "$smoother"
          grep -F 'Vec3 waypoint = new Vec3(lower.x, escapeY, lower.z);' "$probe"
          grep -F 'verticalLeg > DiffractionConfig.verticalOpenGate()' "$probe"
          grep -F '+ DiffractionConfig.diffractionPenalty();' "$probe"
          ! grep -q 'alSource3f' "$probe"
          ! grep -q 'AL_POSITION' "$probe"
          ! grep -q 'AL_GAIN' "$probe"
          ! grep -q 'alSourcePlay' "$probe"

      - name: Verify reconstruction compile classpath
        run: ./gradlew --no-configuration-cache verifyReconstructionClasspath --stacktrace

      - name: Verify resource wiring
        run: ./gradlew --no-configuration-cache verifyResourceWiring --stacktrace

      - name: Clean compile elevation diffraction test
        run: ./gradlew --no-configuration-cache clean compileJava --stacktrace

      - name: Build elevation diffraction test JAR
        run: ./gradlew --no-configuration-cache jar --stacktrace

      - name: Inspect elevation diffraction artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*phase5-diffraction-test*.jar)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          jar tf "$jar" | sort > phase5-diffraction-jar-contents.txt
          count="$(grep -c '\.class$' phase5-diffraction-jar-contents.txt)"
          echo "class_count=$count"
          test "$count" -eq 71
          grep -Fx 'dev/cchqphysics/compat/config/DiffractionConfig.class' phase5-diffraction-jar-contents.txt
          grep -Fx 'dev/cchqphysics/compat/audio/VerticalDiffractionRelief.class' phase5-diffraction-jar-contents.txt
          grep -Fx 'dev/cchqphysics/compat/audio/VerticalDiffractionRelief$PhysicalPosition.class' phase5-diffraction-jar-contents.txt
          grep -Fx 'dev/cchqphysics/compat/audio/VerticalDiffractionRelief$Snapshot.class' phase5-diffraction-jar-contents.txt
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-beta11-phase5-diffraction-test"'
          sha256sum "$jar" | tee phase5-diffraction-jar-sha256.txt
          {
            echo "source_commit=${RUNTIME_SOURCE}"
            echo 'hf50_config_runtime_approved=62d3a7a0a176c901402b913946d98f3cb455a8f4'
            echo 'diffraction_default_enabled=false'
            echo 'max_extra_rays_per_qualified_evaluation=2'
            echo 'sealed_vertical_leg_rejected=true'
            echo 'near_vertical_floor_ceiling_excluded=true'
            echo 'source_al_gain_mutation=false'
            echo 'source_position_mutation=false'
            echo 'reflection_mutation=false'
            echo 'reverb_send_mutation=false'
            echo 'playback_timing_mutation=false'
            echo 'synchronized_start_mutation=false'
            echo 'game_launch_performed=false'
          } > phase5-diffraction-build-info.txt

      - name: Upload elevation diffraction test
        uses: actions/upload-artifact@v4
        with:
          name: cchq-phase5-elevation-diffraction-test
          path: |
            build/libs/*phase5-diffraction-test*.jar
            phase5-diffraction-jar-contents.txt
            phase5-diffraction-jar-sha256.txt
            phase5-diffraction-build-info.txt
