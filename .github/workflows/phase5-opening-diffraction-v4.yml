name: Phase 5 nearby-opening diffraction V4 verification

on:
  push:
    branches:
      - phase5-opening-diffraction-test-v4
    paths:
      - '.github/workflows/phase5-opening-diffraction-v4.yml'
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diffraction V4 branch
        uses: actions/checkout@v4
        with:
          ref: phase5-opening-diffraction-test-v4
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Assert frozen baselines and approved runtime refs
        shell: bash
        run: |
          set -euo pipefail
          phase4='79eed29767343ee34022e8f6268b386f75e84c9f'
          known_good='44612192d875e43ecef66ca51798cab7adb17020'
          hf50='62d3a7a0a176c901402b913946d98f3cb455a8f4'
          v3='b1b97fc7050163e70fbb039f7b76e51eef3c50d0'
          test "$(git ls-remote origin refs/heads/phase4-hotfix3-parity | awk '{print $1}')" = "$phase4"
          test "$(git ls-remote origin refs/heads/phase5-test-candidate-1 | awk '{print $1}')" = "$known_good"
          test "$(git ls-remote origin refs/heads/archive-phase5-hf50-config-runtime-approved | awk '{print $1}')" = "$hf50"
          test "$(git ls-remote origin refs/heads/archive-phase5-diffraction-v3-runtime-approved | awk '{print $1}')" = "$v3"

      - name: Assert V4 identity and performance defaults
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mod_version=0.1.0-beta11-phase5-diffraction-v4-opening-test' gradle.properties
          grep -F 'VERSION = "0.1.0-beta11-phase5-diffraction-v4-opening-test"' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java
          grep -F 'version="0.1.0-beta11-phase5-diffraction-v4-opening-test"' src/main/resources/META-INF/neoforge.mods.toml
          grep -F '"cchq_soundphysics_compat-diffraction-v4-opening-test.toml"' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java
          cfg=src/main/java/dev/cchqphysics/compat/config/DiffractionConfig.java
          grep -F '.define("enabled", false)' "$cfg"
          grep -F '.defineInRange("min_vertical_separation", 0.75D' "$cfg"
          grep -F '.defineInRange("min_horizontal_separation", 1.5D' "$cfg"
          grep -F '.defineInRange("min_vertical_horizontal_ratio", 0.10D' "$cfg"
          grep -F '.defineInRange("raw_occlusion_gate", 3.0D' "$cfg"
          grep -F '.defineInRange("opening_leg_gate", 0.25D' "$cfg"
          grep -F '.defineInRange("base_penalty", 0.75D' "$cfg"
          grep -F '.defineInRange("distance_penalty_per_block", 0.20D' "$cfg"
          grep -F '.defineInRange("scan_interval_ms", 1000.0D' "$cfg"
          grep -F '.defineInRange("leg_recheck_distance", 0.75D' "$cfg"
          grep -F '.defineInRange("ray_cache_ms", 5000.0D' "$cfg"

      - name: Assert V4 cheap-discovery architecture
        shell: bash
        run: |
          set -euo pipefail
          probe=src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'OPENING_VERIFY_CANDIDATES = 2' "$probe"
          grep -F 'LevelAccessUtils.getClientLevelProxy' "$probe"
          grep -F 'getBlockState(cursor).isAir()' "$probe"
          grep -F 'LOWER_LEG_CACHE' "$probe"
          grep -F 'CROSS_LEG_CACHE' "$probe"
          grep -F 'openingLegRecheckDistanceSq()' "$probe"
          grep -F 'openingRayCacheNs()' "$probe"
          grep -F 'applied-direct-open-top' "$probe"
          grep -F 'applied-nearby-opening' "$probe"
          grep -F 'radius * DiffractionConfig.openingDistancePenalty()' "$probe"
          grep -F 'Beta10Optimizer.runOcclusionDirect' "$probe"
          ! grep -F 'OPENING_DIRECTIONS' "$probe"

      - name: Assert approved V3 core outside diffraction remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          v3='b1b97fc7050163e70fbb039f7b76e51eef3c50d0'
          for f in \
            src/main/java/dev/cchqphysics/compat/audio/EnvironmentSmoother.java \
            src/main/java/dev/cchqphysics/compat/audio/SoundPhysicsBridge.java \
            src/main/java/dev/cchqphysics/compat/audio/SynchronizedSpectralBalancer.java \
            src/main/java/dev/cchqphysics/compat/config/SpectralMixConfig.java \
            src/main/java/dev/cchqphysics/compat/audio/ProgressiveOcclusionModel.java \
            src/main/java/dev/cchqphysics/compat/audio/SyncStartCoordinator.java \
            src/main/java/dev/cchqphysics/compat/audio/PositionStabilizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta9Optimizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta10Optimizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta11RoomRayCache.java \
            src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java \
            src/main/java/dev/cchqphysics/compat/config/ClientConfig.java; do
            git diff --exit-code "$v3" -- "$f"
          done

      - name: Assert V4 change scope
        shell: bash
        run: |
          set -euo pipefail
          v3='b1b97fc7050163e70fbb039f7b76e51eef3c50d0'
          git diff --name-only "$v3"...HEAD | sort > changed.txt
          cat changed.txt
          while read -r f; do
            case "$f" in
              .github/workflows/phase5-opening-diffraction-v4.yml|gradle.properties|src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java|src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java|src/main/java/dev/cchqphysics/compat/config/DiffractionConfig.java|src/main/resources/META-INF/neoforge.mods.toml) ;;
              *) echo "unexpected V4 change: $f" >&2; exit 1 ;;
            esac
          done < changed.txt

      - name: Verify reconstruction compile classpath
        run: ./gradlew --no-configuration-cache verifyReconstructionClasspath --stacktrace

      - name: Verify resource wiring
        run: ./gradlew --no-configuration-cache verifyResourceWiring --stacktrace

      - name: Clean compile diffraction V4
        run: ./gradlew --no-configuration-cache clean compileJava --stacktrace

      - name: Build diffraction V4 JAR
        run: ./gradlew --no-configuration-cache jar --stacktrace

      - name: Inspect diffraction V4 artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*phase5-diffraction-v4-opening-test*.jar)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          jar tf "$jar" | sort > phase5-diffraction-v4-jar-contents.txt
          count="$(grep -c '\.class$' phase5-diffraction-v4-jar-contents.txt)"
          echo "class_count=$count"
          test "$count" -ge 73
          test "$count" -le 85
          grep -Fx 'dev/cchqphysics/compat/config/DiffractionConfig.class' phase5-diffraction-v4-jar-contents.txt
          grep -Fx 'dev/cchqphysics/compat/audio/VerticalDiffractionRelief.class' phase5-diffraction-v4-jar-contents.txt
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-beta11-phase5-diffraction-v4-opening-test"'
          sha256sum "$jar" | tee phase5-diffraction-v4-jar-sha256.txt
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo 'v3_runtime_approved=b1b97fc7050163e70fbb039f7b76e51eef3c50d0'
            echo 'hf50_config_runtime_approved=62d3a7a0a176c901402b913946d98f3cb455a8f4'
            echo 'diffraction_config_file=cchq_soundphysics_compat-diffraction-v4-opening-test.toml'
            echo 'direct_open_top_behavior_preserved=true'
            echo 'nearby_opening_discovery=spr_cloned_level_blockstate'
            echo 'nearby_opening_search_radius=3.0'
            echo 'nearby_opening_topology_candidate_limit=8'
            echo 'nearby_opening_verify_candidates=2'
            echo 'nearby_opening_base_penalty=0.75'
            echo 'nearby_opening_distance_penalty_per_block=0.20'
            echo 'nearby_opening_scan_interval_ms=1000'
            echo 'nearby_opening_leg_recheck_distance=0.75'
            echo 'nearby_opening_ray_cache_ms=5000'
            echo 'shared_listener_opening_leg=true'
            echo 'per_source_cross_leg_cache=true'
            echo 'stationary_nearby_opening_expected_extra_spr_rays_after_cache=0'
            echo 'diffraction_default_enabled=false'
            echo 'source_gain_mutation=false'
            echo 'source_position_mutation=false'
            echo 'reflection_mutation=false'
            echo 'reverb_send_mutation=false'
            echo 'playback_timing_mutation=false'
            echo 'synchronized_start_mutation=false'
            echo 'game_launch_performed=false'
          } > phase5-diffraction-v4-build-info.txt

      - name: Upload diffraction V4 test
        uses: actions/upload-artifact@v4
        with:
          name: cchq-phase5-nearby-opening-diffraction-v4-test
          path: |
            build/libs/*phase5-diffraction-v4-opening-test*.jar
            phase5-diffraction-v4-jar-contents.txt
            phase5-diffraction-v4-jar-sha256.txt
            phase5-diffraction-v4-build-info.txt
