name: Phase 5 extended build verification

on:
  push:
    branches:
      - phase5-test-extended
    paths:
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'tools/phase5_verify_defaults.py'
      - '.github/workflows/phase5-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: phase5-test-extended
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Assert frozen Phase 4 parity branch
        shell: bash
        run: |
          set -euo pipefail
          expected='79eed29767343ee34022e8f6268b386f75e84c9f'
          actual="$(git ls-remote origin refs/heads/phase4-hotfix3-parity | awk '{print $1}')"
          echo "Phase 4 frozen head: $actual"
          test "$actual" = "$expected"

      - name: Assert Phase 5 test identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mod_version=0.1.0-beta11-phase5-test' gradle.properties
          grep -F 'VERSION = "0.1.0-beta11-phase5-test"' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java
          grep -F 'cchq_soundphysics_compat-advanced.toml' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java

      - name: Audit Hotfix3-equivalent advanced defaults
        run: python3 tools/phase5_verify_defaults.py

      - name: Confirm primary Hotfix3 config source was not edited
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin phase4-hotfix3-parity
          git diff --exit-code origin/phase4-hotfix3-parity -- src/main/java/dev/cchqphysics/compat/config/ClientConfig.java

      - name: Clean compile extended source
        run: ./gradlew --no-configuration-cache clean compileJava --stacktrace

      - name: Build extended test JAR
        run: ./gradlew --no-configuration-cache jar --stacktrace

      - name: Verify packaged test artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*phase5-test*.jar)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          echo "JAR=$jar"
          jar tf "$jar" | sort > phase5-jar-contents.txt
          for class in \
            dev/cchqphysics/compat/config/ExtendedClientConfig.class \
            dev/cchqphysics/compat/config/ExtendedClientConfigAccess.class \
            dev/cchqphysics/compat/audio/DebugDiagnostics.class \
            dev/cchqphysics/compat/audio/DebugControl.class \
            dev/cchqphysics/compat/audio/DebugCommands.class; do
            grep -Fx "$class" phase5-jar-contents.txt
          done
          sha256sum "$jar" | tee phase5-jar-sha256.txt
          printf '%s\n' "source_commit=${GITHUB_SHA}" > phase5-build-info.txt
          printf '%s\n' "phase4_frozen=79eed29767343ee34022e8f6268b386f75e84c9f" >> phase5-build-info.txt
          printf '%s\n' "game_launch_performed=false" >> phase5-build-info.txt

      - name: Upload verified Phase 5 test build
        uses: actions/upload-artifact@v4
        with:
          name: cchq-phase5-verified-test-build
          path: |
            build/libs/*phase5-test*.jar
            phase5-jar-contents.txt
            phase5-jar-sha256.txt
            phase5-build-info.txt
