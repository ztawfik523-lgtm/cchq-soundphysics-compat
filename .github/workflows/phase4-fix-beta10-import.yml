name: Phase 4 fix Beta10 ClientConfig import

on:
  push:
    branches:
      - beta11-source-reconstruction
    paths:
      - 'tools/phase4_fix_beta10_clientconfig_import.py'
      - '.github/workflows/phase4-fix-beta10-import.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: beta11-source-reconstruction
          fetch-depth: 1
      - name: Apply import fix
        run: python3 tools/phase4_fix_beta10_clientconfig_import.py
      - name: Commit import fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/main/java/dev/cchqphysics/compat/audio/Beta10Optimizer.java; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/dev/cchqphysics/compat/audio/Beta10Optimizer.java
          git commit -m 'Phase 4: restore Beta10 ClientConfig import'
          git push origin HEAD:beta11-source-reconstruction
