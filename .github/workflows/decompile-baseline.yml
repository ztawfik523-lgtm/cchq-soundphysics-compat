name: Decompile Beta11 Hotfix3 baseline

on:
  push:
    branches:
      - beta11-source-reconstruction
    paths:
      - 'reference/beta11-hotfix3.jar.b64.part*'
      - '.github/workflows/decompile-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: beta11-source-reconstruction
          fetch-depth: 0

      - name: Reassemble and verify tested baseline
        shell: bash
        run: |
          mkdir -p build/reference
          cat reference/beta11-hotfix3.jar.b64.part* | base64 --decode > build/reference/beta11-hotfix3.jar
          echo '83500f182fc9829aa1a5a51fbfa11ba6cdfb645699b25d1c445167666dabc1ef  build/reference/beta11-hotfix3.jar' | sha256sum --check

      - name: Download CFR
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            -o build/reference/cfr-0.152.jar \
            https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
          echo '8a85ada8cec494121246805a5562b82b  build/reference/cfr-0.152.jar' | md5sum --check

      - name: Decompile every compat class
        shell: bash
        run: |
          rm -rf reconstruction/raw-cfr
          mkdir -p reconstruction/raw-cfr
          java -jar build/reference/cfr-0.152.jar \
            build/reference/beta11-hotfix3.jar \
            --outputdir reconstruction/raw-cfr \
            --silent true

      - name: Commit raw decompiler reference
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reconstruction/raw-cfr
          if git diff --cached --quiet; then
            echo 'No raw decompiler changes.'
            exit 0
          fi
          git commit -m 'Add CFR reference decompilation of Beta11 Hotfix3'
          git push origin HEAD:beta11-source-reconstruction
