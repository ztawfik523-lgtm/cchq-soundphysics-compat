name: Final lifecycle source audit validation

on:
  push:
    branches: [phase5-v7-1-lifecycle-state-finish]
    paths:
      - 'src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java'
      - 'src/main/java/dev/cchqphysics/compat/mixin/SoundEngineLifecycleMixin.java'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lifecycle branch
        uses: actions/checkout@v4
        with:
          ref: phase5-v7-1-lifecycle-state-finish
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Assert ancestry and frozen acoustic refs
        shell: bash
        run: |
          set -euo pipefail
          base='962eab8b052466ca984496a7dec0767dc65803f4'
          frozen='ffcf5f6e05d85b69f1f1dff8cfae1b082b71604d'
          git merge-base --is-ancestor "$base" HEAD
          test "$(git ls-remote origin refs/heads/archive-phase5-diffraction-v7-1-runtime-approved | awk '{print $1}')" = "$frozen"
          test "$(git ls-remote origin refs/heads/phase5-diffraction-v7-1-runtime-approved | awk '{print $1}')" = "$frozen"

      - name: Assert lifecycle invariants and audit hardening
        shell: bash
        run: |
          set -euo pipefail
          mgr=src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java
          mixin=src/main/java/dev/cchqphysics/compat/mixin/SoundEngineLifecycleMixin.java

          grep -F 'private static ClientLevel trackedLevel;' "$mgr"
          grep -F 'if (trackedLevel != level)' "$mgr"
          grep -F 'soundExecutor().executeBlocking(task);' "$mgr"
          grep -F 'checkAl("allocate source");' "$mgr"
          grep -F 'if (sourceId == 0) throw new IllegalStateException("allocate source returned OpenAL source 0");' "$mgr"
          grep -F 'try { EnvironmentSmoother.unregister(sourceId); } catch (Throwable ignored) {}' "$mgr"
          grep -F 'try { EnvironmentSmoother.unregister(active.sourceId); } catch (Throwable t)' "$mgr"
          grep -F 'try { AL10.alDeleteSources(active.sourceId); } catch (Throwable t)' "$mgr"

          grep -F '@Inject(method = "stopAll", at = @At("HEAD"))' "$mixin"
          grep -F '@Inject(method = "emergencyShutdown", at = @At("HEAD"))' "$mixin"
          ! grep -F '@Inject(method = "destroy"' "$mixin"
          ! grep -F '@Inject(method = "reload"' "$mixin"

          grep -F 'return Beta9Optimizer.isAudibleAndRecord(state.sourceId) & beta9EligibleReal(state, now);' src/main/java/dev/cchqphysics/compat/audio/SoundPhysicsBridge.java

      - name: Assert only lifecycle Java files differ from performance baseline
        shell: bash
        run: |
          set -euo pipefail
          base='962eab8b052466ca984496a7dec0767dc65803f4'
          expected=$'src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java\nsrc/main/java/dev/cchqphysics/compat/mixin/SoundEngineLifecycleMixin.java'
          actual="$(git diff --name-only "$base"...HEAD -- 'src/main/java/**' | sort)"
          test "$actual" = "$expected"

      - name: Assert frozen acoustic/config files unchanged
        shell: bash
        run: |
          set -euo pipefail
          base='962eab8b052466ca984496a7dec0767dc65803f4'
          for f in \
            src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java \
            src/main/java/dev/cchqphysics/compat/audio/SynchronizedSpectralBalancer.java \
            src/main/java/dev/cchqphysics/compat/audio/ProgressiveOcclusionModel.java \
            src/main/java/dev/cchqphysics/compat/audio/EnvironmentSmoother.java \
            src/main/java/dev/cchqphysics/compat/audio/SyncStartCoordinator.java \
            src/main/java/dev/cchqphysics/compat/audio/PositionStabilizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta9Optimizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta10Optimizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta11RoomRayCache.java \
            src/main/java/dev/cchqphysics/compat/config/ClientConfig.java \
            src/main/java/dev/cchqphysics/compat/config/DiffractionConfig.java \
            src/main/java/dev/cchqphysics/compat/config/SpectralMixConfig.java; do
            git diff --exit-code "$base" -- "$f"
          done
          test -z "$(git diff --name-only "$base"...HEAD -- '*.lua')"

      - name: Verify reconstruction compile classpath
        run: ./gradlew --no-configuration-cache verifyReconstructionClasspath --stacktrace

      - name: Verify resource wiring
        run: ./gradlew --no-configuration-cache verifyResourceWiring --stacktrace

      - name: Clean
        run: ./gradlew --no-configuration-cache clean --stacktrace

      - name: Compile Java 21
        run: ./gradlew --no-configuration-cache compileJava --stacktrace

      - name: Build audited lifecycle candidate
        run: ./gradlew --no-configuration-cache jar --stacktrace

      - name: Inspect audited candidate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          jar tf "$jar" | sort > lifecycle-audit-jar-contents.txt
          count="$(grep -c '\.class$' lifecycle-audit-jar-contents.txt)"
          echo "class_count=$count"
          test "$count" -eq 81
          grep -Fx 'dev/cchqphysics/compat/audio/CompatAudioManager.class' lifecycle-audit-jar-contents.txt
          grep -Fx 'dev/cchqphysics/compat/mixin/SoundEngineLifecycleMixin.class' lifecycle-audit-jar-contents.txt
          sha256sum "$jar" | tee lifecycle-audit-jar-sha256.txt
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo 'performance_base=962eab8b052466ca984496a7dec0767dc65803f4'
            echo 'frozen_acoustic_base=ffcf5f6e05d85b69f1f1dff8cfae1b082b71604d'
            echo 'allocation_zero_guard=true'
            echo 'best_effort_active_teardown=true'
            echo 'acoustic_model_changes=false'
            echo 'lua_changes=false'
            echo 'game_launch_performed=false'
          } > lifecycle-audit-build-info.txt

      - name: Upload audited lifecycle candidate
        uses: actions/upload-artifact@v4
        with:
          name: cchq-lifecycle-source-audit-candidate
          path: |
            build/libs/*.jar
            lifecycle-audit-jar-contents.txt
            lifecycle-audit-jar-sha256.txt
            lifecycle-audit-build-info.txt
