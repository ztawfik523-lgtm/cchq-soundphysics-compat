name: Phase 5 finalization verification

on:
  push:
    branches:
      - phase5-finalization
    paths:
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'tools/phase5_verify_defaults.py'
      - '.github/workflows/phase5-final-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          ref: phase5-finalization
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Assert frozen historical refs
        shell: bash
        run: |
          set -euo pipefail
          phase4='79eed29767343ee34022e8f6268b386f75e84c9f'
          candidate1='44612192d875e43ecef66ca51798cab7adb17020'
          test "$(git ls-remote origin refs/heads/phase4-hotfix3-parity | awk '{print $1}')" = "$phase4"
          test "$(git ls-remote origin refs/heads/archive-phase4-hotfix3-parity | awk '{print $1}')" = "$phase4"
          test "$(git ls-remote origin refs/heads/phase5-test-candidate-1 | awk '{print $1}')" = "$candidate1"
          echo "Frozen parity and candidate-1 refs verified"

      - name: Assert final-test identity and config registration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mod_version=0.1.0-beta11-phase5-final-test' gradle.properties
          grep -F 'VERSION = "0.1.0-beta11-phase5-final-test"' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java
          grep -F 'version="0.1.0-beta11-phase5-final-test"' src/main/resources/META-INF/neoforge.mods.toml
          grep -F 'cchq_soundphysics_compat-client.toml' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java
          grep -F 'cchq_soundphysics_compat-advanced.toml' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java
          grep -F 'cchq_soundphysics_compat-mixing.toml' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java

      - name: Audit Hotfix3-equivalent advanced defaults
        run: python3 tools/phase5_verify_defaults.py

      - name: Assert optional mixing feature defaults OFF
        shell: bash
        run: |
          set -euo pipefail
          f=src/main/java/dev/cchqphysics/compat/config/MixClientConfig.java
          grep -F '.define("occluded_source_suppression", false)' "$f"
          grep -F '.defineInRange("suppression_strength", 0.55D, 0.0D, 3.0D)' "$f"
          grep -F '.defineInRange("occlusion_threshold", 0.075D, 0.0D, 4.0D)' "$f"
          grep -F '.defineInRange("minimum_gain_factor", 0.30D, 0.0D, 1.0D)' "$f"
          grep -F 'if (MixClientConfig.enabled())' src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java
          echo "Optional synchronized-mix feature is gated and OFF by default"

      - name: Confirm primary Hotfix3 config source unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin phase4-hotfix3-parity
          git diff --exit-code origin/phase4-hotfix3-parity -- src/main/java/dev/cchqphysics/compat/config/ClientConfig.java

      - name: Verify compile classpath contract
        run: ./gradlew --no-configuration-cache verifyReconstructionClasspath --stacktrace

      - name: Verify resource wiring
        run: ./gradlew --no-configuration-cache verifyResourceWiring --stacktrace

      - name: Clean compile maintained source
        run: ./gradlew --no-configuration-cache clean compileJava --stacktrace

      - name: Build final-test JAR
        run: ./gradlew --no-configuration-cache jar --stacktrace

      - name: Inspect final-test artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*phase5-final-test*.jar)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          jar tf "$jar" | sort > phase5-final-jar-contents.txt
          test "$(grep -c '\.class$' phase5-final-jar-contents.txt)" -eq 66
          for class in \
            dev/cchqphysics/compat/config/ExtendedClientConfig.class \
            dev/cchqphysics/compat/config/ExtendedClientConfigAccess.class \
            dev/cchqphysics/compat/config/MixClientConfig.class \
            dev/cchqphysics/compat/audio/DebugDiagnostics.class \
            dev/cchqphysics/compat/audio/DebugControl.class \
            dev/cchqphysics/compat/audio/DebugCommands.class; do
            grep -Fx "$class" phase5-final-jar-contents.txt
          done
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-beta11-phase5-final-test"'
          sha256sum "$jar" | tee phase5-final-jar-sha256.txt
          printf '%s\n' "source_commit=${GITHUB_SHA}" > phase5-final-build-info.txt
          printf '%s\n' "phase4_frozen=79eed29767343ee34022e8f6268b386f75e84c9f" >> phase5-final-build-info.txt
          printf '%s\n' "candidate1_frozen=44612192d875e43ecef66ca51798cab7adb17020" >> phase5-final-build-info.txt
          printf '%s\n' "mixing_default_enabled=false" >> phase5-final-build-info.txt
          printf '%s\n' "game_launch_performed=false" >> phase5-final-build-info.txt

      - name: Upload verified final-test build
        uses: actions/upload-artifact@v4
        with:
          name: cchq-phase5-final-verified-build
          path: |
            build/libs/*phase5-final-test*.jar
            phase5-final-jar-contents.txt
            phase5-final-jar-sha256.txt
            phase5-final-build-info.txt
