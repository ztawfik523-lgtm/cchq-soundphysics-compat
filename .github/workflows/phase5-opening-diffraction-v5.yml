name: Phase 5 split-aperture diffraction V5 verification

on:
  push:
    branches:
      - phase5-opening-diffraction-test-v5
    paths:
      - '.github/workflows/phase5-opening-diffraction-v5.yml'
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V5 branch
        uses: actions/checkout@v4
        with:
          ref: phase5-opening-diffraction-test-v5
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Assert frozen refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/phase4-hotfix3-parity | awk '{print $1}')" = '79eed29767343ee34022e8f6268b386f75e84c9f'
          test "$(git ls-remote origin refs/heads/phase5-test-candidate-1 | awk '{print $1}')" = '44612192d875e43ecef66ca51798cab7adb17020'
          test "$(git ls-remote origin refs/heads/archive-phase5-hf50-config-runtime-approved | awk '{print $1}')" = '62d3a7a0a176c901402b913946d98f3cb455a8f4'
          test "$(git ls-remote origin refs/heads/archive-phase5-diffraction-v3-runtime-approved | awk '{print $1}')" = 'b1b97fc7050163e70fbb039f7b76e51eef3c50d0'

      - name: Assert V5 identity and config
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mod_version=0.1.0-beta11-phase5-diffraction-v5-aperture-test' gradle.properties
          grep -F 'VERSION = "0.1.0-beta11-phase5-diffraction-v5-aperture-test"' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java
          grep -F 'version="0.1.0-beta11-phase5-diffraction-v5-aperture-test"' src/main/resources/META-INF/neoforge.mods.toml
          grep -F '"cchq_soundphysics_compat-diffraction-v5-aperture-test.toml"' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java
          cfg=src/main/java/dev/cchqphysics/compat/config/DiffractionConfig.java
          grep -F '.define("enabled", false)' "$cfg"
          grep -F '.defineInRange("diffraction_penalty", 0.5D' "$cfg"
          grep -F '.defineInRange("opening_leg_gate", 0.25D' "$cfg"
          grep -F '.defineInRange("base_penalty", 0.75D' "$cfg"
          grep -F '.defineInRange("distance_penalty_per_block", 0.20D' "$cfg"
          grep -F '.defineInRange("scan_interval_ms", 1000.0D' "$cfg"
          grep -F '.defineInRange("leg_recheck_distance", 0.75D' "$cfg"
          grep -F '.defineInRange("ray_cache_ms", 5000.0D' "$cfg"

      - name: Assert split-aperture performance architecture
        shell: bash
        run: |
          set -euo pipefail
          probe=src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'OPENING_VERIFY_CANDIDATES = 2' "$probe"
          grep -F 'OPENING_VERTICAL_SCAN_BLOCKS = 8' "$probe"
          grep -F 'LevelAccessUtils.getClientLevelProxy' "$probe"
          grep -F 'getBlockState(cursor).isAir()' "$probe"
          grep -F 'double lowerWaypointY = topology.barrierY - 0.25D;' "$probe"
          grep -F 'double upperWaypointY = topology.barrierY + Math.max(1.0D, DiffractionConfig.escapeClearance());' "$probe"
          grep -F 'sampleLowerLeg(candidate, topology.barrierY, listener, lowerWaypoint)' "$probe"
          grep -F 'sampleCrossLeg(sourceId, candidate, topology.barrierY, source, upperWaypoint)' "$probe"
          grep -F 'applied-nearby-opening-v5' "$probe"
          grep -F 'LOWER_LEG_CACHE' "$probe"
          grep -F 'CROSS_LEG_CACHE' "$probe"
          grep -F 'openingLegRecheckDistanceSq()' "$probe"
          grep -F 'openingRayCacheNs()' "$probe"
          grep -F 'Beta10Optimizer.runOcclusionDirect' "$probe"
          ! grep -F 'OPENING_DIRECTIONS' "$probe"
          ! grep -F 'double waypointY = topology.barrierY + DiffractionConfig.escapeClearance();' "$probe"

      - name: Assert approved core outside diffraction unchanged
        shell: bash
        run: |
          set -euo pipefail
          v3='b1b97fc7050163e70fbb039f7b76e51eef3c50d0'
          for f in \
            src/main/java/dev/cchqphysics/compat/audio/EnvironmentSmoother.java \
            src/main/java/dev/cchqphysics/compat/audio/SoundPhysicsBridge.java \
            src/main/java/dev/cchqphysics/compat/audio/SynchronizedSpectralBalancer.java \
            src/main/java/dev/cchqphysics/compat/config/SpectralMixConfig.java \
            src/main/java/dev/cchqphysics/compat/audio/ProgressiveOcclusionModel.java \
            src/main/java/dev/cchqphysics/compat/audio/SyncStartCoordinator.java \
            src/main/java/dev/cchqphysics/compat/audio/PositionStabilizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta9Optimizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta10Optimizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta11RoomRayCache.java \
            src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java \
            src/main/java/dev/cchqphysics/compat/config/ClientConfig.java; do
            git diff --exit-code "$v3" -- "$f"
          done

      - name: Assert V5 change scope
        shell: bash
        run: |
          set -euo pipefail
          v3='b1b97fc7050163e70fbb039f7b76e51eef3c50d0'
          git diff --name-only "$v3"...HEAD | sort > changed.txt
          cat changed.txt
          while read -r f; do
            case "$f" in
              .github/workflows/phase5-opening-diffraction-v5.yml|gradle.properties|src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java|src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java|src/main/java/dev/cchqphysics/compat/config/DiffractionConfig.java|src/main/resources/META-INF/neoforge.mods.toml) ;;
              *) echo "unexpected V5 change: $f" >&2; exit 1 ;;
            esac
          done < changed.txt

      - name: Verify reconstruction compile classpath
        run: ./gradlew --no-configuration-cache verifyReconstructionClasspath --stacktrace

      - name: Verify resource wiring
        run: ./gradlew --no-configuration-cache verifyResourceWiring --stacktrace

      - name: Clean compile V5
        run: ./gradlew --no-configuration-cache clean compileJava --stacktrace

      - name: Build V5 JAR
        run: ./gradlew --no-configuration-cache jar --stacktrace

      - name: Inspect V5 artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*phase5-diffraction-v5-aperture-test*.jar)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          jar tf "$jar" | sort > phase5-diffraction-v5-jar-contents.txt
          count="$(grep -c '\.class$' phase5-diffraction-v5-jar-contents.txt)"
          echo "class_count=$count"
          test "$count" -ge 73
          test "$count" -le 85
          grep -Fx 'dev/cchqphysics/compat/config/DiffractionConfig.class' phase5-diffraction-v5-jar-contents.txt
          grep -Fx 'dev/cchqphysics/compat/audio/VerticalDiffractionRelief.class' phase5-diffraction-v5-jar-contents.txt
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-beta11-phase5-diffraction-v5-aperture-test"'
          sha256sum "$jar" | tee phase5-diffraction-v5-jar-sha256.txt
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo 'v4_runtime_evidence=side_opening_unverified_direct_open_top_too_muffled'
            echo 'v3_runtime_approved=b1b97fc7050163e70fbb039f7b76e51eef3c50d0'
            echo 'hf50_config_runtime_approved=62d3a7a0a176c901402b913946d98f3cb455a8f4'
            echo 'nearby_opening_geometry=split_aperture_throat'
            echo 'listener_waypoint=barrierY-0.25'
            echo 'source_waypoint=barrierY+max(1.0,escape_clearance)'
            echo 'nearby_opening_verify_candidates=2'
            echo 'nearby_opening_scan_interval_ms=1000'
            echo 'nearby_opening_leg_recheck_distance=0.75'
            echo 'nearby_opening_ray_cache_ms=5000'
            echo 'direct_open_top_penalty=0.5'
            echo 'diffraction_default_enabled=false'
            echo 'source_gain_mutation=false'
            echo 'source_position_mutation=false'
            echo 'reflection_mutation=false'
            echo 'reverb_send_mutation=false'
            echo 'playback_timing_mutation=false'
            echo 'synchronized_start_mutation=false'
            echo 'game_launch_performed=false'
          } > phase5-diffraction-v5-build-info.txt

      - name: Upload V5 test
        uses: actions/upload-artifact@v4
        with:
          name: cchq-phase5-split-aperture-diffraction-v5-test
          path: |
            build/libs/*phase5-diffraction-v5-aperture-test*.jar
            phase5-diffraction-v5-jar-contents.txt
            phase5-diffraction-v5-jar-sha256.txt
            phase5-diffraction-v5-build-info.txt
