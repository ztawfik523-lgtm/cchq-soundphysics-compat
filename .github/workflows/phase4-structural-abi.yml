name: Phase 4 structural ABI audit

on:
  push:
    branches:
      - beta11-source-reconstruction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-abi:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: beta11-source-reconstruction
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Compile reconstructed classes
        shell: bash
        run: ./gradlew --no-daemon --no-configuration-cache clean compileJava

      - name: Generate reconstructed structural ABI hashes
        shell: bash
        run: |
          python3 tools/class_abi.py build/classes/java/main > reconstructed-abi.txt
          echo "Expected classes:      $(wc -l < docs/baseline/HOTFIX3_STRUCTURAL_ABI_SHA256.txt)"
          echo "Reconstructed classes: $(wc -l < reconstructed-abi.txt)"

      - name: Compare structural ABI with Hotfix3
        shell: bash
        run: |
          diff -u docs/baseline/HOTFIX3_STRUCTURAL_ABI_SHA256.txt reconstructed-abi.txt
          test "$(wc -l < reconstructed-abi.txt)" -eq 60
          echo 'Hotfix3 class/field/method structural ABI: PASS'
