name: Phase 5 final feature apply and build

on:
  push:
    branches:
      - phase5-finalization
    paths:
      - 'tools/phase5_finalize_feature.py'
      - '.github/workflows/phase5-finalize-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          ref: phase5-finalization
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Apply deterministic final feature patch
        run: python3 tools/phase5_finalize_feature.py

      - name: Commit final feature sources
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradle.properties src/main/java src/main/resources
            git commit -m "Phase 5: add optional synchronized occluded-source suppression"
            git push origin HEAD:phase5-finalization
          fi

      - name: Clean compile final feature candidate
        run: ./gradlew --no-configuration-cache clean compileJava --stacktrace

      - name: Build final feature candidate
        run: ./gradlew --no-configuration-cache jar --stacktrace

      - name: Inspect artifact
        shell: bash
        run: |
          set -euo pipefail
          ls -lh build/libs
          jar tf build/libs/*.jar | sort > phase5-final-feature-contents.txt
          sha256sum build/libs/*.jar | tee phase5-final-feature-sha256.txt
          echo "Phase 5 final feature build: PASS"

      - name: Upload feature-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: cchq-phase5-final-feature-test
          path: |
            build/libs/*.jar
            phase5-final-feature-contents.txt
            phase5-final-feature-sha256.txt
