name: Phase 5 V7.1 spreading-only verification

on:
  push:
    branches: [phase5-opening-diffraction-v7-1-spreading-only]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V7.1 branch
        uses: actions/checkout@v4
        with:
          ref: phase5-opening-diffraction-v7-1-spreading-only
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Assert frozen refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/phase4-hotfix3-parity | awk '{print $1}')" = '79eed29767343ee34022e8f6268b386f75e84c9f'
          test "$(git ls-remote origin refs/heads/phase5-test-candidate-1 | awk '{print $1}')" = '44612192d875e43ecef66ca51798cab7adb17020'
          test "$(git ls-remote origin refs/heads/archive-phase5-hf50-config-runtime-approved | awk '{print $1}')" = '62d3a7a0a176c901402b913946d98f3cb455a8f4'
          test "$(git ls-remote origin refs/heads/archive-phase5-diffraction-v3-runtime-approved | awk '{print $1}')" = 'b1b97fc7050163e70fbb039f7b76e51eef3c50d0'

      - name: Assert V7.1 identity and fresh config
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mod_version=0.1.0-beta11-phase5-diffraction-v7-1-spreading-only-test' gradle.properties
          grep -F 'VERSION = "0.1.0-beta11-phase5-diffraction-v7-1-spreading-only-test"' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java
          grep -F 'version="0.1.0-beta11-phase5-diffraction-v7-1-spreading-only-test"' src/main/resources/META-INF/neoforge.mods.toml
          grep -F '"cchq_soundphysics_compat-diffraction-v7-1-spreading-only-test.toml"' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java

      - name: Assert V6 acoustics preserved plus spreading only
        shell: bash
        run: |
          set -euo pipefail
          probe=src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          cfg=src/main/java/dev/cchqphysics/compat/config/DiffractionConfig.java
          grep -F 'double rawRatio = Math.max(0.0D, legRaw / Math.max(1.0E-6D, raw));' "$probe"
          grep -F 'double pathGain = Math.pow(clampFilter(gain), rawRatio);' "$probe"
          grep -F 'double pathCutoff = Math.pow(clampFilter(cutoff), rawRatio);' "$probe"
          grep -F 'double spread = apertureSpreading(candidate.apertureDistance, DiffractionConfig.apertureSpreadScale());' "$probe"
          grep -F 'double coupling = DiffractionConfig.portalCoupling() * activation * candidate.horizonFade * spread;' "$probe"
          grep -F 'double lowAmplitude = coupling * pathGain * lowDiff;' "$probe"
          grep -F 'double highAmplitude = coupling * pathGain * pathCutoff * highDiff;' "$probe"
          grep -F 'applied-portal-energy-v7-1' "$probe"
          grep -F 'OPENING_VERIFY_CANDIDATES = 2' "$probe"
          grep -F 'OPENING_MAX_CONFIG_RADIUS = 8' "$probe"
          grep -F 'LOWER_CACHE_SOFT_LIMIT = 128' "$probe"
          grep -F 'CROSS_CACHE_SOFT_LIMIT = 512' "$probe"
          grep -F 'Beta10Optimizer.runOcclusionDirect' "$probe"
          ! grep -F 'legTransmission(' "$probe"
          ! grep -F 'lowLegScale()' "$probe"
          ! grep -F 'highLegScale()' "$probe"
          ! grep -F 'double legLow' "$probe"
          ! grep -F 'double legHigh' "$probe"
          grep -F '.defineInRange("aperture_spread_scale", 3.0D' "$cfg"
          ! grep -F 'low_leg_scale' "$cfg"
          ! grep -F 'high_leg_scale' "$cfg"

      - name: Assert V6 performance/cache architecture retained
        shell: bash
        run: |
          set -euo pipefail
          cfg=src/main/java/dev/cchqphysics/compat/config/DiffractionConfig.java
          grep -F '.defineInRange("search_radius", 8.0D' "$cfg"
          grep -F '.defineInRange("portal_coupling", 0.25D' "$cfg"
          grep -F '.defineInRange("portal_activation_raw", 2.0D' "$cfg"
          grep -F '.defineInRange("low_delta_scale", 4.0D' "$cfg"
          grep -F '.defineInRange("high_delta_scale", 1.5D' "$cfg"
          grep -F '.defineInRange("horizon_fade_start_ratio", 0.75D' "$cfg"
          grep -F '.defineInRange("candidate_separation", 2.0D' "$cfg"
          grep -F '.defineInRange("selection_hysteresis", 0.35D' "$cfg"
          grep -F '.defineInRange("scan_interval_ms", 1000.0D' "$cfg"
          grep -F '.defineInRange("leg_recheck_distance", 0.75D' "$cfg"
          grep -F '.defineInRange("ray_cache_ms", 5000.0D' "$cfg"
          perf=src/main/java/dev/cchqphysics/compat/audio/PerformanceStats.java
          grep -F 'portalPaths={} ({}/s)' "$perf"
          grep -F 'recordPortalOcclusionPath' "$perf"
          grep -F 'recordPortalTopologyScan' "$perf"

      - name: Assert approved core unchanged from exact V6 build
        shell: bash
        run: |
          set -euo pipefail
          base='f72c106cd94108a418cb6d64cdeb4eb09a68de58'
          for f in \
            src/main/java/dev/cchqphysics/compat/audio/EnvironmentSmoother.java \
            src/main/java/dev/cchqphysics/compat/audio/SoundPhysicsBridge.java \
            src/main/java/dev/cchqphysics/compat/audio/SynchronizedSpectralBalancer.java \
            src/main/java/dev/cchqphysics/compat/config/SpectralMixConfig.java \
            src/main/java/dev/cchqphysics/compat/audio/ProgressiveOcclusionModel.java \
            src/main/java/dev/cchqphysics/compat/audio/SyncStartCoordinator.java \
            src/main/java/dev/cchqphysics/compat/audio/PositionStabilizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta9Optimizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta10Optimizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta11RoomRayCache.java \
            src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java \
            src/main/java/dev/cchqphysics/compat/config/ClientConfig.java; do
            git diff --exit-code "$base" -- "$f"
          done

      - name: Assert V7.1 change scope
        shell: bash
        run: |
          set -euo pipefail
          base='f72c106cd94108a418cb6d64cdeb4eb09a68de58'
          git diff --name-only "$base"...HEAD | sort > changed.txt
          cat changed.txt
          while read -r f; do
            case "$f" in
              .github/workflows/phase5-v7-1-spreading-only.yml|gradle.properties|src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java|src/main/java/dev/cchqphysics/compat/audio/PerformanceStats.java|src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java|src/main/java/dev/cchqphysics/compat/config/DiffractionConfig.java|src/main/resources/META-INF/neoforge.mods.toml) ;;
              *) echo "unexpected V7.1 change: $f" >&2; exit 1 ;;
            esac
          done < changed.txt

      - name: Verify reconstruction compile classpath
        run: ./gradlew --no-configuration-cache verifyReconstructionClasspath --stacktrace

      - name: Verify resource wiring
        run: ./gradlew --no-configuration-cache verifyResourceWiring --stacktrace

      - name: Clean compile V7.1
        run: ./gradlew --no-configuration-cache clean compileJava --stacktrace

      - name: Build V7.1 JAR
        run: ./gradlew --no-configuration-cache jar --stacktrace

      - name: Inspect V7.1 artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*phase5-diffraction-v7-1-spreading-only-test*.jar)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          jar tf "$jar" | sort > phase5-v7-1-jar-contents.txt
          count="$(grep -c '\.class$' phase5-v7-1-jar-contents.txt)"
          echo "class_count=$count"
          test "$count" -ge 79
          test "$count" -le 83
          grep -Fx 'dev/cchqphysics/compat/config/DiffractionConfig.class' phase5-v7-1-jar-contents.txt
          grep -Fx 'dev/cchqphysics/compat/audio/VerticalDiffractionRelief.class' phase5-v7-1-jar-contents.txt
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-beta11-phase5-diffraction-v7-1-spreading-only-test"'
          sha256sum "$jar" | tee phase5-v7-1-jar-sha256.txt
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo 'exact_v6_base=f72c106cd94108a418cb6d64cdeb4eb09a68de58'
            echo 'v6_transmission_math_preserved=true'
            echo 'v7_leg_transmission_rewrite=false'
            echo 'aperture_spreading_only_acoustic_addition=true'
            echo 'aperture_spread_scale=3.0'
            echo 'implicit_open_top_spread=1.0'
            echo 'portal_specific_perf_telemetry=true'
            echo 'nearby_opening_verify_candidates=2'
            echo 'shared_listener_topology=true'
            echo 'shared_listener_opening_leg=true'
            echo 'per_source_cross_leg_cache=true'
            echo 'source_gain_mutation=false'
            echo 'source_position_mutation=false'
            echo 'reflection_mutation=false'
            echo 'reverb_send_mutation=false'
            echo 'playback_timing_mutation=false'
            echo 'synchronized_start_mutation=false'
            echo 'game_launch_performed=false'
          } > phase5-v7-1-build-info.txt

      - name: Upload V7.1 test
        uses: actions/upload-artifact@v4
        with:
          name: cchq-phase5-v7-1-spreading-only-test
          path: |
            build/libs/*phase5-diffraction-v7-1-spreading-only-test*.jar
            phase5-v7-1-jar-contents.txt
            phase5-v7-1-jar-sha256.txt
            phase5-v7-1-build-info.txt
