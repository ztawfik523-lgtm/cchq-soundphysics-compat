name: Phase 5 V7.1 spreading-only bootstrap

on:
  push:
    branches: [phase5-opening-diffraction-v7-1-spreading-only-working]

permissions:
  contents: write

jobs:
  patch-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5-opening-diffraction-v7-1-spreading-only-working
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Correct patcher telemetry marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/phase5_v7_1_spreading_only_patch.py')
          s = p.read_text()
          if 'progressivePasses' not in s:
              raise SystemExit('expected old patcher marker missing')
          p.write_text(s.replace('progressivePasses', 'progressiveEvals'))
          PY
      - name: Apply asserted V7.1 source patch
        run: python3 tools/phase5_v7_1_spreading_only_patch.py
      - name: Diff sanity
        shell: bash
        run: |
          set -euo pipefail
          base='f72c106cd94108a418cb6d64cdeb4eb09a68de58'
          probe=src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'double rawRatio =' "$probe"
          grep -F 'Math.pow(clampFilter(gain), rawRatio)' "$probe"
          grep -F 'Math.pow(clampFilter(cutoff), rawRatio)' "$probe"
          grep -F 'apertureSpreading(candidate.apertureDistance' "$probe"
          ! grep -F 'legTransmission(' "$probe"
          ! grep -F 'lowLegScale()' "$probe"
          ! grep -F 'highLegScale()' "$probe"
      - name: Clean compile Java 21
        run: ./gradlew --no-configuration-cache clean compileJava --stacktrace
      - name: Commit compiled V7.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle.properties src/main/java src/main/resources/META-INF/neoforge.mods.toml
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'Phase 5: isolate V6 acoustics plus aperture spreading'
            git push origin HEAD:phase5-opening-diffraction-v7-1-spreading-only-working
          fi
