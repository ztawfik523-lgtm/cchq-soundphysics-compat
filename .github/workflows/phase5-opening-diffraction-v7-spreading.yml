name: Phase 5 aperture spreading V7 verification

on:
  push:
    branches:
      - phase5-opening-diffraction-energy-v7-spreading
    paths:
      - '.github/workflows/phase5-opening-diffraction-v7-spreading.yml'
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V7 branch
        uses: actions/checkout@v4
        with:
          ref: phase5-opening-diffraction-energy-v7-spreading
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Assert frozen refs
        shell: bash
        run: |
          set -euo pipefail
          phase4='79eed29767343ee34022e8f6268b386f75e84c9f'
          known_good='44612192d875e43ecef66ca51798cab7adb17020'
          hf50='62d3a7a0a176c901402b913946d98f3cb455a8f4'
          v3='b1b97fc7050163e70fbb039f7b76e51eef3c50d0'
          test "$(git ls-remote origin refs/heads/phase4-hotfix3-parity | awk '{print $1}')" = "$phase4"
          test "$(git ls-remote origin refs/heads/phase5-test-candidate-1 | awk '{print $1}')" = "$known_good"
          test "$(git ls-remote origin refs/heads/archive-phase5-hf50-config-runtime-approved | awk '{print $1}')" = "$hf50"
          test "$(git ls-remote origin refs/heads/archive-phase5-diffraction-v3-runtime-approved | awk '{print $1}')" = "$v3"

      - name: Assert V7 identity and fresh config
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mod_version=0.1.0-beta11-phase5-diffraction-v7-spreading-test' gradle.properties
          grep -F 'VERSION = "0.1.0-beta11-phase5-diffraction-v7-spreading-test"' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java
          grep -F 'version="0.1.0-beta11-phase5-diffraction-v7-spreading-test"' src/main/resources/META-INF/neoforge.mods.toml
          grep -F '"cchq_soundphysics_compat-diffraction-v7-spreading-test.toml"' src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java
          cfg=src/main/java/dev/cchqphysics/compat/config/DiffractionConfig.java
          grep -F '.define("enabled", false)' "$cfg"
          grep -F '.defineInRange("search_radius", 8.0D' "$cfg"
          grep -F '.defineInRange("portal_coupling", 0.25D' "$cfg"
          grep -F '.defineInRange("portal_activation_raw", 2.0D' "$cfg"
          grep -F '.defineInRange("low_delta_scale", 4.0D' "$cfg"
          grep -F '.defineInRange("high_delta_scale", 1.5D' "$cfg"
          grep -F '.defineInRange("low_leg_scale", 4.0D' "$cfg"
          grep -F '.defineInRange("high_leg_scale", 1.5D' "$cfg"
          grep -F '.defineInRange("aperture_spread_scale", 3.0D' "$cfg"
          grep -F '.defineInRange("horizon_fade_start_ratio", 0.75D' "$cfg"
          grep -F '.defineInRange("candidate_separation", 2.0D' "$cfg"
          grep -F '.defineInRange("selection_hysteresis", 0.35D' "$cfg"
          grep -F '.defineInRange("scan_interval_ms", 1000.0D' "$cfg"
          grep -F '.defineInRange("leg_recheck_distance", 0.75D' "$cfg"
          grep -F '.defineInRange("ray_cache_ms", 5000.0D' "$cfg"

      - name: Assert isolated V7 acoustic model
        shell: bash
        run: |
          set -euo pipefail
          probe=src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'OPENING_VERIFY_CANDIDATES = 2' "$probe"
          grep -F 'OPENING_MAX_CONFIG_RADIUS = 8' "$probe"
          grep -F 'LOWER_CACHE_SOFT_LIMIT = 128' "$probe"
          grep -F 'CROSS_CACHE_SOFT_LIMIT = 512' "$probe"
          grep -F 'LevelAccessUtils.getClientLevelProxy' "$probe"
          grep -F 'getBlockState(cursor).isAir()' "$probe"
          grep -F 'double delta = Math.max(0.0D, route - directDistance);' "$probe"
          grep -F 'legTransmission(legRaw, DiffractionConfig.lowLegScale())' "$probe"
          grep -F 'legTransmission(legRaw, DiffractionConfig.highLegScale())' "$probe"
          grep -F 'apertureSpreading(candidate.apertureDistance, DiffractionConfig.apertureSpreadScale())' "$probe"
          grep -F 'safeScale / (safeScale + Math.max(0.0D, distance))' "$probe"
          grep -F 'listener.distanceTo(lowerWaypoint), directDistance' "$probe"
          grep -F 'new PortalCandidate(key, waypoint, waypoint, 0.0D, 0.0D' "$probe"
          grep -F 'Vec3 waypoint = new Vec3(listener.x, y, listener.z);' "$probe"
          grep -F 'portalLowEnergy += weight * portal.lowAmplitude * portal.lowAmplitude;' "$probe"
          grep -F 'portalHighEnergy += weight * portal.highAmplitude * portal.highAmplitude;' "$probe"
          grep -F 'Math.sqrt(directLow * directLow + portalLowEnergy)' "$probe"
          grep -F 'applied-portal-energy-v7' "$probe"
          grep -F 'PRIMARY_BY_SOURCE' "$probe"
          grep -F 'DiffractionConfig.selectionHysteresis()' "$probe"
          grep -F 'DiffractionConfig.candidateSeparationSq()' "$probe"
          grep -F 'Beta10Optimizer.runOcclusionDirect' "$probe"
          ! grep -F 'Math.pow(clampFilter' "$probe"
          ! grep -F 'rawRatio' "$probe"
          ! grep -F 'applied-direct-open-top' "$probe"
          ! grep -F 'applied-nearby-opening' "$probe"
          ! grep -F 'candidateRaw' "$probe"

      - name: Assert portal-specific telemetry
        shell: bash
        run: |
          set -euo pipefail
          perf=src/main/java/dev/cchqphysics/compat/audio/PerformanceStats.java
          probe=src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'recordPortalOcclusionPath' "$perf"
          grep -F 'recordPortalTopologyScan' "$perf"
          grep -F 'portalPaths=' "$perf"
          grep -F 'portalLower=' "$perf"
          grep -F 'portalCross=' "$perf"
          grep -F 'portalScans=' "$perf"
          grep -F 'portalBlockChecks=' "$perf"
          grep -F 'PerformanceStats.recordPortalOcclusionPath' "$probe"
          grep -F 'PerformanceStats.recordPortalTopologyScan' "$probe"

      - name: Assert approved core unchanged from exact V6 build
        shell: bash
        run: |
          set -euo pipefail
          base='f72c106cd94108a418cb6d64cdeb4eb09a68de58'
          for f in \
            src/main/java/dev/cchqphysics/compat/audio/EnvironmentSmoother.java \
            src/main/java/dev/cchqphysics/compat/audio/SoundPhysicsBridge.java \
            src/main/java/dev/cchqphysics/compat/audio/SynchronizedSpectralBalancer.java \
            src/main/java/dev/cchqphysics/compat/config/SpectralMixConfig.java \
            src/main/java/dev/cchqphysics/compat/audio/ProgressiveOcclusionModel.java \
            src/main/java/dev/cchqphysics/compat/audio/SyncStartCoordinator.java \
            src/main/java/dev/cchqphysics/compat/audio/PositionStabilizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta9Optimizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta10Optimizer.java \
            src/main/java/dev/cchqphysics/compat/audio/Beta11RoomRayCache.java \
            src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java \
            src/main/java/dev/cchqphysics/compat/config/ClientConfig.java; do
            git diff --exit-code "$base" -- "$f"
          done

      - name: Assert V7 change scope
        shell: bash
        run: |
          set -euo pipefail
          base='f72c106cd94108a418cb6d64cdeb4eb09a68de58'
          git diff --name-only "$base"...HEAD | sort > changed.txt
          cat changed.txt
          while read -r f; do
            case "$f" in
              .github/workflows/phase5-opening-diffraction-v7-spreading.yml|gradle.properties|src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java|src/main/java/dev/cchqphysics/compat/audio/PerformanceStats.java|src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java|src/main/java/dev/cchqphysics/compat/config/DiffractionConfig.java|src/main/resources/META-INF/neoforge.mods.toml) ;;
              *) echo "unexpected V7 change: $f" >&2; exit 1 ;;
            esac
          done < changed.txt

      - name: Verify reconstruction compile classpath
        run: ./gradlew --no-configuration-cache verifyReconstructionClasspath --stacktrace

      - name: Verify resource wiring
        run: ./gradlew --no-configuration-cache verifyResourceWiring --stacktrace

      - name: Clean compile V7
        run: ./gradlew --no-configuration-cache clean compileJava --stacktrace

      - name: Build V7 JAR
        run: ./gradlew --no-configuration-cache jar --stacktrace

      - name: Inspect V7 artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*phase5-diffraction-v7-spreading-test*.jar)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          jar tf "$jar" | sort > phase5-diffraction-v7-jar-contents.txt
          count="$(grep -c '\.class$' phase5-diffraction-v7-jar-contents.txt)"
          echo "class_count=$count"
          test "$count" -ge 78
          test "$count" -le 90
          grep -Fx 'dev/cchqphysics/compat/config/DiffractionConfig.class' phase5-diffraction-v7-jar-contents.txt
          grep -Fx 'dev/cchqphysics/compat/audio/VerticalDiffractionRelief.class' phase5-diffraction-v7-jar-contents.txt
          grep -Fx 'dev/cchqphysics/compat/audio/PerformanceStats.class' phase5-diffraction-v7-jar-contents.txt
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-beta11-phase5-diffraction-v7-spreading-test"'
          sha256sum "$jar" | tee phase5-diffraction-v7-jar-sha256.txt
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo 'v6_runtime_source=f72c106cd94108a418cb6d64cdeb4eb09a68de58'
            echo 'v3_runtime_approved=b1b97fc7050163e70fbb039f7b76e51eef3c50d0'
            echo 'hf50_config_runtime_approved=62d3a7a0a176c901402b913946d98f3cb455a8f4'
            echo 'diffraction_config_file=cchq_soundphysics_compat-diffraction-v7-spreading-test.toml'
            echo 'portal_energy_combination=quadrature_two_band'
            echo 'explicit_aperture_spreading=softened_inverse_distance_amplitude'
            echo 'aperture_spread_scale=3.0'
            echo 'independent_leg_transmission=true'
            echo 'low_leg_scale=4.0'
            echo 'high_leg_scale=1.5'
            echo 'legacy_pow_raw_ratio_removed=true'
            echo 'implicit_open_top_geometry_changed=false'
            echo 'nearby_opening_search_radius=8.0'
            echo 'nearby_opening_verify_candidates=2'
            echo 'portal_specific_telemetry=true'
            echo 'shared_listener_topology=true'
            echo 'shared_listener_opening_leg=true'
            echo 'per_source_cross_leg_cache=true'
            echo 'source_gain_mutation=false'
            echo 'source_position_mutation=false'
            echo 'reflection_mutation=false'
            echo 'reverb_send_mutation=false'
            echo 'playback_timing_mutation=false'
            echo 'synchronized_start_mutation=false'
            echo 'game_launch_performed=false'
          } > phase5-diffraction-v7-build-info.txt

      - name: Upload V7 test
        uses: actions/upload-artifact@v4
        with:
          name: cchq-phase5-aperture-spreading-v7-test
          path: |
            build/libs/*phase5-diffraction-v7-spreading-test*.jar
            phase5-diffraction-v7-jar-contents.txt
            phase5-diffraction-v7-jar-sha256.txt
            phase5-diffraction-v7-build-info.txt
