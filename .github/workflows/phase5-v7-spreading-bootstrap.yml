name: Phase 5 V7 spreading bootstrap

on:
  push:
    branches: [phase5-opening-diffraction-energy-v7-spreading-working]

permissions:
  contents: write

jobs:
  patch-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5-opening-diffraction-energy-v7-spreading-working
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Patch exact V6 source into isolated V7 spreading candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, got {count}")
              return text.replace(old, new, 1)

          gradle = Path('gradle.properties')
          if 'phase5-diffraction-v7-spreading-test' in gradle.read_text():
              print('V7 already patched; nothing to do')
              raise SystemExit(0)

          # --- VerticalDiffractionRelief: preserve V6 geometry/caches, change only portal transmission/spreading + telemetry ---
          p = Path('src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java')
          s = p.read_text()
          s = replace_once(s, 'Experimental V6 opening diffraction model.', 'Experimental V7 opening diffraction model.', 'class comment')
          s = replace_once(s,
'''            double legRaw = Math.max(0.0D, lower.value) + Math.max(0.0D, upper.value);
            double rawRatio = Math.max(0.0D, legRaw / Math.max(1.0E-6D, raw));
            double pathGain = Math.pow(clampFilter(gain), rawRatio);
            double pathCutoff = Math.pow(clampFilter(cutoff), rawRatio);

            double lowDiff = diffractionStrength(candidate.delta, DiffractionConfig.lowDeltaScale());
            double highDiff = diffractionStrength(candidate.delta, DiffractionConfig.highDeltaScale());
            double activation = smoothStep(clamp01(raw / Math.max(1.0E-6D, DiffractionConfig.portalActivationRaw())));
            double coupling = DiffractionConfig.portalCoupling() * activation * candidate.horizonFade;

            double lowAmplitude = coupling * pathGain * lowDiff;
            double highAmplitude = coupling * pathGain * pathCutoff * highDiff;
            double quality = candidate.horizonFade / (1.0D + candidate.delta + 0.5D * legRaw);

            verified.add(new VerifiedPortal(candidate, lower.value, upper.value, legRaw,
                    lowDiff, highDiff, lowAmplitude, highAmplitude,
                    Math.max(1.0E-9D, quality), lower.cached && upper.cached));''',
'''            double legRaw = Math.max(0.0D, lower.value) + Math.max(0.0D, upper.value);
            double legLow = legTransmission(legRaw, DiffractionConfig.lowLegScale());
            double legHigh = legTransmission(legRaw, DiffractionConfig.highLegScale());

            double lowDiff = diffractionStrength(candidate.delta, DiffractionConfig.lowDeltaScale());
            double highDiff = diffractionStrength(candidate.delta, DiffractionConfig.highDeltaScale());
            double spread = apertureSpreading(candidate.apertureDistance, DiffractionConfig.apertureSpreadScale());
            double activation = smoothStep(clamp01(raw / Math.max(1.0E-6D, DiffractionConfig.portalActivationRaw())));
            double coupling = DiffractionConfig.portalCoupling() * activation * candidate.horizonFade * spread;

            double lowAmplitude = coupling * legLow * lowDiff;
            double highAmplitude = coupling * legHigh * highDiff;
            double quality = candidate.horizonFade * spread / (1.0D + candidate.delta + 0.5D * legRaw);

            verified.add(new VerifiedPortal(candidate, lower.value, upper.value, legRaw,
                    legLow, legHigh, lowDiff, highDiff, spread, lowAmplitude, highAmplitude,
                    Math.max(1.0E-9D, quality), lower.cached && upper.cached));''', 'portal amplitude block')
          s = replace_once(s, '? "applied-portal-energy-v6" : "portal-energy-negligible"', '? "applied-portal-energy-v7" : "portal-energy-negligible"', 'reason version')
          s = replace_once(s,
'''        snapshot.lowDiff = best.lowDiff;
        snapshot.highDiff = best.highDiff;
        snapshot.portalLowAmplitude = Math.sqrt(portalLowEnergy);''',
'''        snapshot.legLow = best.legLow;
        snapshot.legHigh = best.legHigh;
        snapshot.lowDiff = best.lowDiff;
        snapshot.highDiff = best.highDiff;
        snapshot.spread = best.spread;
        snapshot.portalLowAmplitude = Math.sqrt(portalLowEnergy);''', 'snapshot values')
          # Explicit roof opening gets true listener->aperture distance. Implicit open-top stays distance 0 to preserve the approved V6 open-top behavior in this isolated candidate.
          s = replace_once(s,
'''            result.add(new PortalCandidate(key, waypoint, waypoint, 0.0D,
                    directDistance, route, delta, 1.0D));''',
'''            result.add(new PortalCandidate(key, waypoint, waypoint, 0.0D, 0.0D,
                    directDistance, route, delta, 1.0D));''', 'implicit candidate aperture distance')
          s = replace_once(s,
'''            result.add(new PortalCandidate(key, lowerWaypoint, upperWaypoint, opening.radius,
                    directDistance, route, delta, fade));''',
'''            result.add(new PortalCandidate(key, lowerWaypoint, upperWaypoint, opening.radius,
                    listener.distanceTo(lowerWaypoint), directDistance, route, delta, fade));''', 'explicit candidate aperture distance')
          s = replace_once(s, 'lower = sampleLowerLeg(candidate, listener);', 'lower = sampleLowerLeg(candidate, listener);', 'lower call anchor')
          s = replace_once(s, 'double value = runOcclusion(listener, candidate.lowerWaypoint);', 'double value = runOcclusion(listener, candidate.lowerWaypoint, true);', 'lower portal telemetry')
          s = replace_once(s, 'double value = runOcclusion(source, candidate.upperWaypoint);', 'double value = runOcclusion(source, candidate.upperWaypoint, false);', 'cross portal telemetry')
          s = replace_once(s,
'''    private static double runOcclusion(Vec3 from, Vec3 to) throws Exception {
        PerformanceStats.recordOcclusionPath();
        return Beta10Optimizer.runOcclusionDirect(from, to);
    }''',
'''    private static double runOcclusion(Vec3 from, Vec3 to, boolean lowerLeg) throws Exception {
        long start = System.nanoTime();
        try {
            return Beta10Optimizer.runOcclusionDirect(from, to);
        } finally {
            PerformanceStats.recordPortalOcclusionPath(System.nanoTime() - start, lowerLeg);
        }
    }''', 'portal runOcclusion telemetry')
          s = replace_once(s,
'''        OpeningTopology result = new OpeningTopology(baseX, baseY, baseZ, scanTopY,
                now, barrierY, openings.toArray(new OpeningCandidate[0]), blockChecks, false);''',
'''        OpeningTopology result = new OpeningTopology(baseX, baseY, baseZ, scanTopY,
                now, barrierY, openings.toArray(new OpeningCandidate[0]), blockChecks, false);
        PerformanceStats.recordPortalTopologyScan(blockChecks);''', 'topology telemetry')
          s = replace_once(s,
'''                    + " lowDiff=" + r3(s.lowDiff)
                    + " highDiff=" + r3(s.highDiff)
                    + " portalLow=" + r3(s.portalLowAmplitude)''',
'''                    + " legLow=" + r3(s.legLow)
                    + " legHigh=" + r3(s.legHigh)
                    + " lowDiff=" + r3(s.lowDiff)
                    + " highDiff=" + r3(s.highDiff)
                    + " spread=" + r3(s.spread)
                    + " portalLow=" + r3(s.portalLowAmplitude)''', 'debug fields')
          s = replace_once(s,
'''    private static double diffractionStrength(double delta, double scale) {
        double safeScale = Math.max(1.0E-6D, scale);
        return 1.0D / Math.sqrt(1.0D + Math.max(0.0D, delta) / safeScale);
    }''',
'''    private static double diffractionStrength(double delta, double scale) {
        double safeScale = Math.max(1.0E-6D, scale);
        return 1.0D / Math.sqrt(1.0D + Math.max(0.0D, delta) / safeScale);
    }

    private static double legTransmission(double legRaw, double scale) {
        double safeScale = Math.max(1.0E-6D, scale);
        return 1.0D / Math.sqrt(1.0D + Math.max(0.0D, legRaw) / safeScale);
    }

    private static double apertureSpreading(double distance, double scale) {
        double safeScale = Math.max(1.0E-6D, scale);
        return safeScale / (safeScale + Math.max(0.0D, distance));
    }''', 'math helpers')
          s = replace_once(s,
'''    private record PortalCandidate(CandidateKey key,
                                   Vec3 lowerWaypoint,
                                   Vec3 upperWaypoint,
                                   double radius,
                                   double directDistance,''',
'''    private record PortalCandidate(CandidateKey key,
                                   Vec3 lowerWaypoint,
                                   Vec3 upperWaypoint,
                                   double radius,
                                   double apertureDistance,
                                   double directDistance,''', 'candidate record')
          s = replace_once(s,
'''    private record VerifiedPortal(PortalCandidate candidate,
                                  double lowerLeg,
                                  double upperLeg,
                                  double legRaw,
                                  double lowDiff,
                                  double highDiff,
                                  double lowAmplitude,''',
'''    private record VerifiedPortal(PortalCandidate candidate,
                                  double lowerLeg,
                                  double upperLeg,
                                  double legRaw,
                                  double legLow,
                                  double legHigh,
                                  double lowDiff,
                                  double highDiff,
                                  double spread,
                                  double lowAmplitude,''', 'verified record')
          s = replace_once(s,
'''        double lowDiff = Double.NaN;
        double highDiff = Double.NaN;
        double portalLowAmplitude = Double.NaN;''',
'''        double legLow = Double.NaN;
        double legHigh = Double.NaN;
        double lowDiff = Double.NaN;
        double highDiff = Double.NaN;
        double spread = Double.NaN;
        double portalLowAmplitude = Double.NaN;''', 'snapshot fields')
          # Ensure the inherited exponent-ratio hack is actually gone.
          if 'Math.pow(clampFilter' in s or 'rawRatio' in s:
              raise SystemExit('V7 invariant failed: inherited pow/rawRatio leg model still present')
          p.write_text(s)

          # --- DiffractionConfig ---
          p = Path('src/main/java/dev/cchqphysics/compat/config/DiffractionConfig.java')
          s = p.read_text()
          s = replace_once(s, '/** Experimental V6 aperture-energy diffraction model. */', '/** Experimental V7 aperture-energy spreading model. */', 'config comment')
          s = replace_once(s, 'private static final ModConfigSpec.DoubleValue HIGH_DELTA_SCALE;', 'private static final ModConfigSpec.DoubleValue HIGH_DELTA_SCALE;\n    private static final ModConfigSpec.DoubleValue LOW_LEG_SCALE;\n    private static final ModConfigSpec.DoubleValue HIGH_LEG_SCALE;\n    private static final ModConfigSpec.DoubleValue APERTURE_SPREAD_SCALE;', 'config fields')
          s = replace_once(s, 'builder.push("portal_diffraction_v6_test");', 'builder.push("portal_diffraction_v7_spreading_test");', 'config root')
          s = replace_once(s, '"Experimental Phase-5 V6 aperture-energy diffraction model."', '"Experimental Phase-5 V7 aperture-energy spreading model."', 'config title')
          s = replace_once(s,
'''        HIGH_DELTA_SCALE = builder.comment(
                "Path-length-difference scale for the high-band diffraction approximation.",
                "Smaller than the low-band scale so highs attenuate more strongly as the detour worsens.")
                .defineInRange("high_delta_scale", 1.5D, 0.05D, 32.0D);

        HORIZON_FADE_START_RATIO''',
'''        HIGH_DELTA_SCALE = builder.comment(
                "Path-length-difference scale for the high-band diffraction approximation.",
                "Smaller than the low-band scale so highs attenuate more strongly as the detour worsens.")
                .defineInRange("high_delta_scale", 1.5D, 0.05D, 32.0D);

        LOW_LEG_SCALE = builder.comment(
                "Independent low-band transmission scale for SPR-verified portal-leg occlusion.",
                "Replaces V6's inherited pow(direct, legRaw/raw) approximation.")
                .defineInRange("low_leg_scale", 4.0D, 0.10D, 32.0D);

        HIGH_LEG_SCALE = builder.comment(
                "Independent high-band transmission scale for SPR-verified portal-leg occlusion.",
                "Smaller than the low-band scale so obstructed portal legs darken rather than over-brighten the path.")
                .defineInRange("high_leg_scale", 1.5D, 0.05D, 32.0D);

        APERTURE_SPREAD_SCALE = builder.comment(
                "Softened inverse-distance amplitude scale for explicit roof-opening leakage into the listener enclosure.",
                "This is independent of the 8-block discovery radius; the horizon fade remains only a scan-boundary safety net.",
                "Implicit open-top geometry uses zero aperture distance in this isolated candidate to preserve the approved V6 open-top behavior.")
                .defineInRange("aperture_spread_scale", 3.0D, 0.25D, 16.0D);

        HORIZON_FADE_START_RATIO''', 'new V7 config parameters')
          s = replace_once(s, 'public static double highDeltaScale() { return d(HIGH_DELTA_SCALE, 1.5D); }', 'public static double highDeltaScale() { return d(HIGH_DELTA_SCALE, 1.5D); }\n    public static double lowLegScale() { return d(LOW_LEG_SCALE, 4.0D); }\n    public static double highLegScale() { return d(HIGH_LEG_SCALE, 1.5D); }\n    public static double apertureSpreadScale() { return d(APERTURE_SPREAD_SCALE, 3.0D); }', 'config getters')
          s = replace_once(s, '+ " portalV6=true"', '+ " portalV7=true"', 'summary version')
          s = replace_once(s, '+ " highDeltaScale=" + highDeltaScale()\n                + " horizonFadeStart="', '+ " highDeltaScale=" + highDeltaScale()\n                + " lowLegScale=" + lowLegScale()\n                + " highLegScale=" + highLegScale()\n                + " apertureSpreadScale=" + apertureSpreadScale()\n                + " horizonFadeStart="', 'summary fields')
          p.write_text(s)

          # --- PerformanceStats: attribution only; no scheduling/cache behavior changes ---
          p = Path('src/main/java/dev/cchqphysics/compat/audio/PerformanceStats.java')
          s = p.read_text()
          s = replace_once(s, 'private static long occlusionPaths;\n    private static long efxApplies;', 'private static long occlusionPaths;\n    private static long portalOcclusionPaths;\n    private static long portalOcclusionTotalNs;\n    private static long portalOcclusionMaxNs;\n    private static long portalLowerPaths;\n    private static long portalCrossPaths;\n    private static long portalTopologyScans;\n    private static long portalBlockChecks;\n    private static long efxApplies;', 'perf fields')
          s = replace_once(s, 'static void recordOcclusionPath() { occlusionPaths++; }', '''static void recordOcclusionPath() { occlusionPaths++; }

    static void recordPortalOcclusionPath(long elapsedNs, boolean lowerLeg) {
        occlusionPaths++;
        portalOcclusionPaths++;
        long value = Math.max(0L, elapsedNs);
        portalOcclusionTotalNs += value;
        if (value > portalOcclusionMaxNs) portalOcclusionMaxNs = value;
        if (lowerLeg) portalLowerPaths++;
        else portalCrossPaths++;
    }

    static void recordPortalTopologyScan(int blockChecks) {
        portalTopologyScans++;
        portalBlockChecks += Math.max(0, blockChecks);
    }''', 'perf methods')
          s = replace_once(s, 'double sprAvgMs = sprCalls == 0L ? 0.0D : (sprTotalNs / 1_000_000.0D) / sprCalls;', 'double sprAvgMs = sprCalls == 0L ? 0.0D : (sprTotalNs / 1_000_000.0D) / sprCalls;\n            double portalAvgMs = portalOcclusionPaths == 0L ? 0.0D : (portalOcclusionTotalNs / 1_000_000.0D) / portalOcclusionPaths;', 'portal avg')
          s = replace_once(s,
'applyPasses={} ({}/s) occlusionPaths={} ({}/s) progressive={}',
'applyPasses={} ({}/s) occlusionPaths={} ({}/s) portalPaths={} ({}/s) portalAvg={}ms portalMax={}ms portalLower={} portalCross={} portalScans={} portalBlockChecks={} progressive={}', 'perf format')
          s = replace_once(s,
'''                    applyPasses, round1(applyPasses / seconds),
                    occlusionPaths, round1(occlusionPaths / seconds),
                    progressiveEvals,''',
'''                    applyPasses, round1(applyPasses / seconds),
                    occlusionPaths, round1(occlusionPaths / seconds),
                    portalOcclusionPaths, round1(portalOcclusionPaths / seconds), round3(portalAvgMs), round3(portalOcclusionMaxNs / 1_000_000.0D),
                    portalLowerPaths, portalCrossPaths, portalTopologyScans, portalBlockChecks,
                    progressiveEvals,''', 'perf args')
          s = replace_once(s, 'occlusionPaths = 0L;\n        efxApplies = efxReattachPasses = 0L;', 'occlusionPaths = 0L;\n        portalOcclusionPaths = portalOcclusionTotalNs = portalOcclusionMaxNs = 0L;\n        portalLowerPaths = portalCrossPaths = portalTopologyScans = portalBlockChecks = 0L;\n        efxApplies = efxReattachPasses = 0L;', 'perf reset')
          p.write_text(s)

          # --- Test identity / fresh config filename ---
          p = Path('src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java')
          s = p.read_text()
          s = replace_once(s, '0.1.0-beta11-phase5-diffraction-v6-energy-test', '0.1.0-beta11-phase5-diffraction-v7-spreading-test', 'java version')
          s = replace_once(s, '// Fresh V6 filename prevents any V1-V5 experimental values from altering the portal-energy test.\n        container.registerConfig(ModConfig.Type.CLIENT, DiffractionConfig.SPEC, "cchq_soundphysics_compat-diffraction-v6-energy-test.toml");', '// Fresh V7 filename prevents earlier experimental values from altering the spreading test.\n        container.registerConfig(ModConfig.Type.CLIENT, DiffractionConfig.SPEC, "cchq_soundphysics_compat-diffraction-v7-spreading-test.toml");', 'config filename')
          s = replace_once(s, 'V6 aperture-energy diffraction test available and OFF by default', 'V7 aperture-energy spreading test available and OFF by default', 'startup text')
          p.write_text(s)

          p = Path('gradle.properties')
          s = p.read_text()
          s = replace_once(s, '# Phase 5 V6 replaces the V3-V5 alternate-path replacement formulas with a\n# bounded secondary aperture-energy contribution driven by path difference.', '# Phase 5 V7 preserves the V6 secondary-energy architecture and adds an\n# isolated listener-side aperture-spreading term plus portal-specific telemetry.', 'gradle comment')
          s = replace_once(s, 'mod_version=0.1.0-beta11-phase5-diffraction-v6-energy-test', 'mod_version=0.1.0-beta11-phase5-diffraction-v7-spreading-test', 'gradle version')
          p.write_text(s)

          p = Path('src/main/resources/META-INF/neoforge.mods.toml')
          s = p.read_text()
          s = replace_once(s, 'version="0.1.0-beta11-phase5-diffraction-v6-energy-test"', 'version="0.1.0-beta11-phase5-diffraction-v7-spreading-test"', 'toml version')
          # Keep dependency metadata, replace only the experiment description.
          old_start = "description='''Phase 5 isolated V6 aperture-energy diffraction experiment"
          if old_start not in s:
              raise SystemExit('toml description: V6 marker not found')
          start = s.index("description='''")
          end = s.index("'''", start + len("description='''")) + 3
          desc = "description='''Phase 5 isolated V7 spreading experiment built on the exact V6 runtime candidate. The V6 secondary-energy architecture, two-candidate verification ceiling, cloned-level topology scan, listener-shared lower-leg cache, per-source upper-leg cache, candidate separation/hysteresis, and approved HF50/core behavior are preserved. V7 removes the inherited pow(direct, legRaw/raw) portal-leg approximation, derives independent low/high leg transmission directly from verified leg occlusion, and adds a softened inverse-distance aperture-spreading multiplier for explicit roof openings. The implicit open-top geometry is intentionally preserved for this isolated test so the already-good open-pit result is not changed by two variables at once. Portal-specific performance counters are added for 12-source attribution. No source position, playback timing, synchronized start, reflection, reverb-send, or Lua behavior is changed. The experiment is OFF by default.'''
"
          s = s[:start] + desc + s[end:]
          p.write_text(s)

          print('V7 spreading patch applied')
          PY
      - name: Diff sanity
        run: |
          git diff --check
          git diff --stat
          grep -R "phase5-diffraction-v7-spreading-test" -n gradle.properties src/main/java/dev/cchqphysics/compat/CCHQSoundPhysicsCompat.java src/main/resources/META-INF/neoforge.mods.toml
          ! grep -q "Math.pow(clampFilter" src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -q "apertureSpreading" src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -q "portalPaths=" src/main/java/dev/cchqphysics/compat/audio/PerformanceStats.java
      - name: Clean compile Java 21
        run: ./gradlew --no-daemon --no-configuration-cache clean compileJava
      - name: Commit compiled V7 source
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle.properties src/main/java src/main/resources/META-INF/neoforge.mods.toml
          git commit -m 'Phase 5: add isolated V7 aperture spreading and portal telemetry'
          git push origin HEAD:phase5-opening-diffraction-energy-v7-spreading-working
