name: Release Surface Cleanup

on:
  push:
    branches:
      - phase5-cleanup-config-first

permissions:
  contents: write

jobs:
  cleanup-build:
    if: github.event.head_commit.message != 'cleanup release-facing source and build text'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preserve critical file before cleanup
        run: git show HEAD:src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java > /tmp/VerticalDiffractionRelief.before.java

      - name: Apply asserted release-surface cleanup
        run: python .github/release_surface_cleanup.py

      - name: Verify cleanup-only scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "build.gradle src/main/java/dev/cchqphysics/compat/audio/AcousticCapture.java src/main/java/dev/cchqphysics/compat/audio/Beta10Optimizer.java src/main/java/dev/cchqphysics/compat/audio/Beta11RoomRayCache.java src/main/java/dev/cchqphysics/compat/audio/Beta9Optimizer.java src/main/java/dev/cchqphysics/compat/audio/CompatAudioManager.java src/main/java/dev/cchqphysics/compat/audio/EnvironmentSmoother.java src/main/java/dev/cchqphysics/compat/audio/PositionStabilizer.java src/main/java/dev/cchqphysics/compat/audio/ProgressiveOcclusionModel.java src/main/java/dev/cchqphysics/compat/audio/RoomSchedulerClient.java src/main/java/dev/cchqphysics/compat/audio/SoundPhysicsBridge.java src/main/java/dev/cchqphysics/compat/audio/SyncStartCoordinator.java src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java src/main/java/dev/cchqphysics/compat/config/ExtendedClientConfig.java "

          # Preserve the required source eligibility semantics exactly.
          grep -F 'return Beta9Optimizer.isAudibleAndRecord(state.sourceId) & beta9EligibleReal(state, now);' src/main/java/dev/cchqphysics/compat/audio/SoundPhysicsBridge.java

          # Frozen opening formulas/constants remain present exactly.
          grep -F 'private static final int OPENING_VERIFY_CANDIDATES = 2;' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'private static final int OPENING_MAX_CONFIG_RADIUS = 8;' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'double rawRatio = Math.max(0.0D, legRaw / Math.max(1.0E-6D, raw));' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'double pathGain = Math.pow(clampFilter(gain), rawRatio);' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'double pathCutoff = Math.pow(clampFilter(cutoff), rawRatio);' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'double spread = apertureSpreading(candidate.apertureDistance, DiffractionConfig.apertureSpreadScale());' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'double coupling = DiffractionConfig.portalCoupling() * activation * candidate.horizonFade * spread;' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java
          grep -F 'double quality = candidate.horizonFade * spread / (1.0D + candidate.delta + 0.5D * legRaw);' src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java

          # The critical file may change only comments and diagnostic/reason text.
          python - <<'PY'
          from pathlib import Path
          import difflib
          before = Path('/tmp/VerticalDiffractionRelief.before.java').read_text().splitlines()
          after = Path('src/main/java/dev/cchqphysics/compat/audio/VerticalDiffractionRelief.java').read_text().splitlines()
          changed = []
          for line in difflib.unified_diff(before, after, n=0):
              if line.startswith(('---','+++','@@')):
                  continue
              if line.startswith(('+','-')):
                  changed.append(line[1:].strip())
          allowed_terms = (
              'Experimental V7.1', 'Unlike V3-V5', 'occlusion result', 'aperture contributes',
              'Path-length difference', 'two SPR legs', 'combined without adding playback',
              'Opening-aware vertical sound model', 'verified opening contributes',
              'normal direct occlusion', 'Indirect route length', 'the opening. No extra playback',
              'position change is introduced', 'applied-portal-energy-v7-1', 'portal-energy-negligible',
              'applied-opening-energy', 'opening-energy-negligible', '[phase5/diffraction]', '[dump/openings]',
              '*', '*/'
          )
          bad = [x for x in changed if x and not any(t in x for t in allowed_terms)]
          if bad:
              raise SystemExit('Unexpected critical-file diff lines: ' + repr(bad))
          print('Critical opening file diff limited to comments/diagnostic strings:', len(changed), 'lines')
          PY

      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build.gradle src/main/java/dev/cchqphysics/compat/audio src/main/java/dev/cchqphysics/compat/config/ExtendedClientConfig.java
          git commit -m 'cleanup release-facing source and build text'
          git push origin HEAD:phase5-cleanup-config-first

      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Inspect JAR
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n1)
          test -n "$JAR"
          export JAR
          sha256sum "$JAR"
          python - <<'PY'
          import os, zipfile
          jar=os.environ['JAR']
          with zipfile.ZipFile(jar) as z:
              classes=[x for x in z.namelist() if x.endswith('.class')]
              assert len(classes) == 81, len(classes)
              print('class_count=', len(classes))
          PY
