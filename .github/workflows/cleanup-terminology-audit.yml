name: Cleanup Terminology Audit

on:
  push:
    branches:
      - phase5-cleanup-config-first

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source and release-facing terminology inventory
        shell: bash
        run: |
          echo '=== SOURCE / BUILD / README ==='
          grep -R -n -E 'Phase[- ]?[0-9]|phase[0-9]|Hotfix|HF50|Issue-A|Issue A|V7\.1|v7-1|beta[0-9]|Beta[0-9]|alpha[0-9]' src build.gradle gradle.properties README.md || true
          echo '=== WORKFLOW INVENTORY ==='
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort
          echo '=== DOC INVENTORY ==='
          find docs -maxdepth 2 -type f -printf '%p\n' | sort
