name: Phase 4 exact default-state patch

on:
  push:
    branches:
      - beta11-source-reconstruction
    paths:
      - 'tools/phase4_exact_defaults_patch.py'
      - '.github/workflows/phase4-apply-exact-defaults.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: beta11-source-reconstruction
          fetch-depth: 1

      - name: Apply exact Hotfix3 defaults
        run: python3 tools/phase4_exact_defaults_patch.py

      - name: Commit corrected sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/main/java; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/dev/cchqphysics/compat/audio/Beta9Optimizer.java \
                  src/main/java/dev/cchqphysics/compat/audio/ProgressiveOcclusionModel.java \
                  src/main/java/dev/cchqphysics/compat/audio/EnvironmentSmoother.java
          git commit -m 'Phase 4: restore exact Hotfix3 initial audio states'
          git push origin HEAD:beta11-source-reconstruction
