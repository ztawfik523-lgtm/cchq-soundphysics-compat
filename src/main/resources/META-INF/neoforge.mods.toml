[[mods]]
modId="cchq_soundphysics_compat"
version="${mod_version}"
displayName="CC:HQ Sound Physics Compat"
authors="CC:HQ / Sound Physics compatibility"
description='''Client-side compatibility layer that routes CC:HQ whole-file speaker playback through positional OpenAL sources so Sound Physics Remastered can apply distance, occlusion, reflections and reverb correctly. Includes synchronized-speaker handling, per-source EFX isolation, progressive obstruction, and the validated opening/diffraction behavior used by the final acoustic preset.'''

[[mixins]]
config="cchq_soundphysics_compat.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

