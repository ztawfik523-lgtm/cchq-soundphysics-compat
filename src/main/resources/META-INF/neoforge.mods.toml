[[mods]]
modId="cchq_soundphysics_compat"
version="0.1.0-beta11-phase5-diffraction-v6-energy-test"
displayName="CC:HQ Sound Physics Compat"
authors="CC:HQ / Sound Physics compatibility"
description='''Phase 5 isolated aperture-energy diffraction experiment V6 built on the runtime-approved configurable HF50 baseline. V6 retires the V3-V5 behavior where an alternate opening route could replace the direct occlusion result. The normal progressive direct path remains authoritative; a verified roof/open-top aperture contributes only a bounded secondary low/high energy path. Aperture strength is driven by source->aperture->listener path-length difference, verified leg occlusion, and a smooth finite-search fade. High-band aperture energy decays faster than low-band energy. At most two candidates are acoustically verified, listener-side topology is shared, and verification legs are cached. Source position, source playback gain, PCM/OpenAL clocks, synchronized starts, reflection routing, and reverb sends are not mutated. The experiment is OFF by default.'''

