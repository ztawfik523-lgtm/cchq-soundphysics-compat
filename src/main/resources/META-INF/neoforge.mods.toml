[[mods]]
modId="cchq_soundphysics_compat"
version="0.1.0-beta11.1-rc1"
displayName="CC:HQ Sound Physics Compat"
authors="CC:HQ / Sound Physics compatibility"
description='''Client-side compatibility layer for CC:HQ Speakers and Sound Physics Remastered on Minecraft 1.21.1 / NeoForge. Preserves the validated progressive direct-occlusion path, private per-source EFX, synchronized-start handling, approved HF50 synchronized spectral balancing, and the approved V7.1 bounded aperture-energy diffraction path. V7.1 remains a secondary energy contribution only: it never replaces the direct path and does not change source position, PCM/OpenAL playback clocks, synchronized-start timing, reflection routing, or reverb sends. This release candidate also includes performance, lifecycle, decode-backpressure, and OpenAL resource-cleanup hardening.'''

