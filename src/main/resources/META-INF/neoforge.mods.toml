[[mods]]
modId="cchq_soundphysics_compat"
version="0.1.0-beta11-hotfix3"
displayName="CC:HQ Sound Physics Compat"
authors="CC:HQ / Sound Physics compatibility"
description='''Beta11 exact-optimization and production-hardening build: preserves beta9/Beta10 acoustics and transition behavior; retains Beta10 exact direct-occlusion sharing and OpenAL state suppression; adds an exact cache for SPR static environment/bounce raycasts scoped to the current cloned BlockGetter; adds cross-clone reuse-potential telemetry without enabling unsafe cross-clone reuse; batches PCM mono downmix writes; and starts synchronized HQ source groups with OpenAL alSourcePlayv; incomplete declared groups now get a short sound-thread grace period and then start all sources that actually arrived together instead of being destroyed in AL_INITIAL. No room-ray count, bounce count, direct probe geometry, distance curve, EFX attachment semantics, or playback clock is reduced or approximated.'''

