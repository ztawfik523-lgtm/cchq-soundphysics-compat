modId="cchq_soundphysics_compat"
version="0.1.0-beta11-phase5-diffraction-test"
displayName="CC:HQ Sound Physics Compat"
authors="CC:HQ / Sound Physics compatibility"
description='''Phase 5 isolated steep-elevation/open-top diffraction experiment built on the runtime-approved configurable HF50 baseline. Normal 17-ray progressive occlusion remains authoritative. Only when raw occlusion is already severe and the source/listener geometry is steep does the test probe a two-segment route above the lower endpoint; the lower vertical escape leg must be nearly clear, deliberately rejecting sealed floors and ceilings. The experiment is OFF by default and never changes source position, synchronized playback timing, reflection routing, or reverb sends.'''

