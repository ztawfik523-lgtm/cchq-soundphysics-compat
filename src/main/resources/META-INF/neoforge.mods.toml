version="0.1.0-beta11-phase5-acousticprobe-auto-test"
displayName="CC:HQ Sound Physics Compat"
authors="CC:HQ / Sound Physics compatibility"
description='''Phase 5 acoustic-mix isolation build. It retains synchronized playback-cursor telemetry and Issue-A diagnostics, and adds runtime-only acoustic A/B probes that automatically target the darkest tracked speaker. The probes can silence only that speaker's auxiliary reverb sends or bypass only its direct high-frequency low-pass factor while preserving source gain, source position and playback timing.'''

