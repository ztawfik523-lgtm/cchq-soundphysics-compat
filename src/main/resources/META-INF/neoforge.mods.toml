[[mods]]
modId="cchq_soundphysics_compat"
version="0.1.0-beta11-phase5-sync-hf50-config-test"
displayName="CC:HQ Sound Physics Compat"
authors="CC:HQ / Sound Physics compatibility"
description='''Phase 5 configurable synchronized direct-HF candidate derived from the user's HF dose A/B. When a synchronized source is strongly low-passed, a clear synchronized peer exists, and the spectral gap is large, the candidate raises only that source's direct low-pass cutoff toward the clearest peer. The dark-source gate, clear-peer gate, minimum gap, lift strength, and maximum lift are configurable; validated defaults reproduce the approved HF50 candidate. It never changes source gain, source position, reverb-send filters, PCM timing, or synchronized start behavior.'''

