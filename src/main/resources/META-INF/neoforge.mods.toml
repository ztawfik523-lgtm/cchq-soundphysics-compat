modId="cchq_soundphysics_compat"
version="0.1.0-beta11-phase5-diffraction-v3-test"
displayName="CC:HQ Sound Physics Compat"
authors="CC:HQ / Sound Physics compatibility"
description='''Phase 5 isolated steep-elevation/open-top diffraction experiment V3 built on the runtime-approved configurable HF50 baseline. The V2 diffraction algorithm and relaxed ear-to-source activation defaults are preserved. V3 changes only the test packaging so diffraction uses a fresh config filename and cannot inherit stale V1/V2 gate values. Normal 17-ray progressive occlusion remains authoritative; severe raw occlusion, horizontal bounds, the nearly-clear vertical escape requirement, diffraction penalty, source position, synchronized playback timing, reflection routing, and reverb sends remain unchanged. The experiment is OFF by default.'''

