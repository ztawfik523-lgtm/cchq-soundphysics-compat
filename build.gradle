plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()

    maven {
        name = 'CC-Tweaked'
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }

    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
    }
}

neoForge {
    version = neo_version
    validateAccessTransformers = true

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

def sprDependency = "maven.modrinth:qyVF9oeo:${spr_modrinth_version_id}"
def hqSpeakerDependency = "maven.modrinth:cchq-speakers:${hqspeaker_modrinth_selector}"
def clothConfigDependency = "curse.maven:cloth-config-348521:${cloth_config_curse_file}"
def ccTweakedApiDependency = "cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${cc_tweaked_version}"

dependencies {
    // Exact SPR release used by the tested Beta11 Hotfix3 environment.
    implementation sprDependency

    // Optional config UI used by the baseline source/config classes.
    implementation clothConfigDependency

    // CC:Tweaked API version present in the tested environment.
    compileOnly ccTweakedApiDependency

    // Tested runtime target: CC:HQ Speakers 1.1.4 / NeoForge / MC 1.21.1.
    // Modrinth Maven's loader/game filter removes the old incorrect 1.0.1
    // local-file dependency from the reconstruction build.
    compileOnly hqSpeakerDependency
    localRuntime hqSpeakerDependency
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Capture the FileCollection during configuration so the verification task is
// compatible with Gradle's configuration cache.
def reconstructionCompileClasspath = configurations.compileClasspath

tasks.register('verifyReconstructionClasspath') {
    group = 'verification'
    description = 'Resolve and print the reconstruction compile classpath without compiling incomplete Phase 3 sources.'
    inputs.files(reconstructionCompileClasspath)

    doLast {
        def resolved = inputs.files.files.toList().sort { a, b -> a.name <=> b.name }
        if (resolved.isEmpty()) {
            throw new GradleException('compileClasspath resolved to no files')
        }

        println "Resolved compileClasspath (${resolved.size()} files):"
        resolved.each { println " - ${it.name}" }
    }
}
