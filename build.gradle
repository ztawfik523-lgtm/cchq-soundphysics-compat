plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()

    maven {
        name = 'CC-Tweaked'
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }

    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
    }
}

neoForge {
    version = neo_version
    validateAccessTransformers = true

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

def sprDependency = "maven.modrinth:qyVF9oeo:${spr_modrinth_version_id}"
def hqSpeakerDependency = "maven.modrinth:${hqspeaker_modrinth_project_id}:${hqspeaker_modrinth_version_id}"
def clothConfigDependency = "curse.maven:cloth-config-348521:${cloth_config_curse_file}"
def ccTweakedApiDependency = "cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${cc_tweaked_version}"

dependencies {
    // Exact SPR release used by the tested Beta11 Hotfix3 environment.
    implementation sprDependency

    // Optional config UI used by the baseline source/config classes.
    implementation clothConfigDependency

    // CC:Tweaked API version present in the tested environment.
    compileOnly ccTweakedApiDependency

    // The tested runtime JAR is the Modrinth 1.0.1 NeoForge/1.21.1 file even
    // though its internal mod version reports 1.1.4-neoforge-1.21.1. Pin its
    // immutable Modrinth project/version IDs rather than deriving Maven coords
    // from the internal mod version string.
    compileOnly hqSpeakerDependency
    localRuntime hqSpeakerDependency
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('verifyReconstructionClasspath') {
    group = 'verification'
    description = 'Resolve and print the reconstruction compile classpath without compiling incomplete Phase 3 sources.'
    notCompatibleWithConfigurationCache('This audit task intentionally resolves and enumerates the live dependency graph.')

    doLast {
        def resolved = configurations.compileClasspath.resolve().toList().sort { a, b -> a.name <=> b.name }
        if (resolved.isEmpty()) {
            throw new GradleException('compileClasspath resolved to no files')
        }

        println "Resolved compileClasspath (${resolved.size()} files):"
        resolved.each { println " - ${it.name}" }
    }
}

tasks.register('verifyResourceWiring') {
    group = 'verification'
    description = 'Exercise Gradle resource processing and verify NeoForge mixin/access-transformer registration.'
    dependsOn tasks.named('processResources')
    notCompatibleWithConfigurationCache('This reconstruction audit intentionally inspects processed files and source topology.')

    doLast {
        def outputRoot = layout.buildDirectory.dir('resources/main').get().asFile
        def requiredResources = [
            'META-INF/MANIFEST.MF',
            'META-INF/neoforge.mods.toml',
            'META-INF/accesstransformer.cfg',
            'cchq_soundphysics_compat.mixins.json'
        ]

        requiredResources.each { relativePath ->
            def processed = new File(outputRoot, relativePath)
            if (!processed.isFile()) {
                throw new GradleException("Processed resource missing: ${relativePath}")
            }
        }

        def modsToml = new File(outputRoot, 'META-INF/neoforge.mods.toml').getText('UTF-8')
        if (!modsToml.contains('config="cchq_soundphysics_compat.mixins.json"')) {
            throw new GradleException('neoforge.mods.toml does not register the compat mixin config')
        }
        if (!modsToml.contains('file="META-INF/accesstransformer.cfg"')) {
            throw new GradleException('neoforge.mods.toml does not register the access transformer')
        }

        def mixinConfig = new groovy.json.JsonSlurper().parse(new File(outputRoot, 'cchq_soundphysics_compat.mixins.json'))
        if (mixinConfig.package != 'dev.cchqphysics.compat.mixin') {
            throw new GradleException("Unexpected mixin package: ${mixinConfig.package}")
        }
        if (!(mixinConfig.client instanceof List) || mixinConfig.client.isEmpty()) {
            throw new GradleException('Mixin config has no client mixins')
        }

        def missingSourceMixins = []
        mixinConfig.client.each { mixinName ->
            def source = file("src/main/java/dev/cchqphysics/compat/mixin/${mixinName}.java")
            if (!source.isFile()) {
                missingSourceMixins << mixinName
            }
        }

        println "Resource wiring verified: ${requiredResources.size()} processed resources, ${mixinConfig.client.size()} client mixins, access transformer registered."
        if (!missingSourceMixins.isEmpty()) {
            println "Phase 3 source boundary: ${missingSourceMixins.size()} configured mixin source files are not reconstructed yet: ${missingSourceMixins.join(', ')}"
        }
    }
}
